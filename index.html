 box:{es:[["Lugares","El bar, la plaza, el centro"],["Expresión","fare due passi"],["Mañana","Un espresso en el bar"],["Domingo","Almuerzo en familia"]],ru:[["Места","Бар, площадь, центр"],["Выражение","fare due passi"],["Утро","Эспрессо в баре"],["Воскресенье","Семейный обед"]],it:[["Luoghi","Il bar, la piazza, il centro"],["Espressione","fare due passi"],["Mattina","Un espresso al bar"],["Domenica","Pranzo in famiglia"]],en:[["Places","The bar, the piazza, the centre"],["Expression","fare due passi"],["Morning","An espresso at the bar"],["Sunday","Family lunch"]]},
 t:{es:{h:"Uscire: salir a la italiana",l:"El bar, la plaza y «fare due passi».",b:`<p>Para muchos italianos <b>uscire</b> (salir) no es solo ir fuera de casa: es un estilo de vida. Se sale para tomar un café, pasear, encontrarse con amigos o comer algo juntos.</p><p>El <b>bar</b> italiano no es un lugar de copas: es donde se toma el espresso de pie por la mañana, se desayuna un cappuccino con un cornetto y se lee el periódico. La <b>piazza</b> es la sala de estar de la ciudad.</p><p>Pasear se dice <b>fare due passi</b>, literalmente «dar dos pasos». El domingo, muchas familias almuerzan juntas.</p>`},
    ru:{h:"Uscire: выходить по-итальянски",l:"Бар, площадь и «fare due passi».",b:`<p>Для многих итальянцев <b>uscire</b> (выходить) — это не просто выйти из дома, а образ жизни. Выходят, чтобы выпить кофе, прогуляться, встретиться с друзьями или вместе поесть.</p><p>Итальянский <b>бар</b> — не место для выпивки. Там утром стоя пьют эспрессо, завтракают капучино с корнетто и читают газету. <b>Пьяцца</b> — гостиная города.</p><p>Прогуляться по-итальянски — <b>fare due passi</b>, буквально «сделать два шага». По воскресеньям многие семьи обедают вместе.</p>`},
    it:{h:"Uscire",l:"Il bar, la piazza e «fare due passi».",b:`<p>Per molti italiani <b>uscire</b> non è solo andare fuori casa: è uno stile di vita. Si esce per prendere un caffè, fare una passeggiata, incontrare gli amici o mangiare qualcosa insieme.</p><p>Il <b>bar</b> è il posto dell’espresso al banco la mattina, del cappuccino con il cornetto e del giornale. La <b>piazza</b> è il salotto della città: bar, tavolini, negozi e persone che parlano senza fretta.</p><p>Passeggiare si dice anche <b>fare due passi</b>. La domenica molte famiglie pranzano insieme. Uscire è una piccola festa della vita.</p>`},
    en:{h:"Uscire: going out Italian-style",l:"The bar, the piazza and “fare due passi”.",b:`<p>For many Italians <b>uscire</b> (going out) is not just leaving the house: it is a way of life. People go out for a coffee, a stroll, to meet friends or to eat something together.</p><p>The Italian <b>bar</b> is not a pub. It is where you drink an espresso standing at the counter in the morning, have a cappuccino and a cornetto, and read the paper. The <b>piazza</b> is the city’s living room.</p><p>Going for a short walk is <b>fare due passi</b>, literally “taking two steps”. On Sundays many families have lunch together.</p>`}}},

{id:"venezia",cat:"lugares",cult:"it",src:"Ciao, amore! A1 · Unità 1–6 e 9",see:["uscire","sinea"],
 box:{es:[["Región","Véneto, noreste de Italia"],["Símbolos","Canales, góndolas, máscaras, puentes"],["Fiesta","El Carnaval"],["Desafíos","Turismo masivo, acqua alta"]],ru:[["Регион","Венето, северо-восток Италии"],["Символы","Каналы, гондолы, маски, мосты"],["Праздник","Карнавал"],["Проблемы","Массовый туризм, acqua alta"]],it:[["Regione","Veneto, nord-est d’Italia"],["Simboli","Canali, gondole, maschere, ponti"],["Festa","Il Carnevale"],["Sfide","Turismo di massa, acqua alta"]],en:[["Region","Veneto, north-east Italy"],["Symbols","Canals, gondolas, masks, bridges"],["Festival","Carnival"],["Challenges","Mass tourism, acqua alta"]]},
 t:{es:{h:"Venecia",l:"La ciudad del agua y de las máscaras, escenario de «Ciao, amore!».",b:`<p>Venecia es una ciudad única: en lugar de grandes calles tiene <b>canales</b>, y casi no hay coches porque la ciudad vive sobre el agua. Se camina por calles estrechas y se cruzan puentes; la plaza principal es <b>Piazza San Marco</b>.</p><p>La <b>máscara veneciana</b> es símbolo del Carnaval, pero en mi manual es más: Natalia, la veneciana, lleva su máscara clásica como parte de su historia.</p><p>Venecia también enfrenta problemas modernos: debe protegerse del turismo masivo y del <b>acqua alta</b>, las mareas altas que inundan la ciudad.</p>`},
    ru:{h:"Венеция",l:"Город воды и масок, где происходит действие «Ciao, amore!».",b:`<p>Венеция уникальна: вместо широких улиц здесь <b>каналы</b>, и машин почти нет, потому что город живёт на воде. Ходят по узким улочкам и мостам; главная площадь — <b>Пьяцца Сан-Марко</b>.</p><p><b>Венецианская маска</b> — символ карнавала, но в моём учебнике это больше: Наталья, венецианка, носит свою классическую маску как часть своей истории.</p><p>У Венеции есть и современные проблемы: город должен защищаться от массового туризма и от <b>acqua alta</b> — высокой воды, которая затапливает улицы.</p>`},
    it:{h:"Venezia",l:"La città dell’acqua e delle maschere, scenario di «Ciao, amore!».",b:`<p>Venezia è una città unica al mondo: invece di grandi strade ci sono i <b>canali</b>, e non ci sono macchine perché la città vive sull’acqua. Si cammina per calli strette e si attraversano ponti; la piazza principale è <b>Piazza San Marco</b>.</p><p>La <b>maschera veneziana</b> è il simbolo del Carnevale, ma nel mio manuale è di più: Natalia, la veneziana, porta la sua maschera classica come parte della sua storia.</p><p>Venezia deve anche proteggersi dal turismo di massa e dall’<b>acqua alta</b>, le maree che allagano la città.</p>`},
    en:{h:"Venice",l:"The city of water and masks, setting of “Ciao, amore!”.",b:`<p>Venice is unique: instead of big streets it has <b>canals</b>, and there are almost no cars because the city lives on the water. You walk along narrow alleys and over bridges; the main square is <b>Piazza San Marco</b>.</p><p>The <b>Venetian mask</b> is the symbol of Carnival, but in my textbook it means more: Natalia, the Venetian, wears her classic mask as part of her story.</p><p>Venice also faces modern problems: it must protect itself from mass tourism and from <b>acqua alta</b>, the high tides that flood the city.</p>`}}},

{id:"stereotipi",cat:"costumbres",cult:"it",src:"Ciao, amore! A1 · Unità 2",see:["italiani-nel-mondo","uscire"],
 box:{es:[["Qué es","Una idea simple sobre un pueblo"],["Ejemplos","Italianos y gestos, argentinos y tango"],["Actitud","Curiosidad, con cuidado"]],ru:[["Что это","Упрощённое представление о народе"],["Примеры","Итальянцы и жесты, аргентинцы и танго"],["Подход","Интерес, но осторожно"]],it:[["Che cos’è","Un’idea semplice su un popolo"],["Esempi","Italiani e gesti, argentini e tango"],["Atteggiamento","Curiosità, con attenzione"]],en:[["What it is","A simple idea about a people"],["Examples","Italians and gestures, Argentines and tango"],["Attitude","Curious, but careful"]]},
 t:{es:{h:"Estereotipos",l:"Simpáticos a veces, pero no siempre verdaderos.",b:`<p>Un estereotipo es una idea simple sobre un pueblo o una cultura. Se dice que todos los italianos hablan con las manos y aman la pasta, que todos los argentinos bailan tango, que los brasileños siempre están alegres o que los alemanes son muy puntuales.</p><p>Muchos tienen algo de verdad: en Italia se usan mucho los gestos y el tango es muy importante en Buenos Aires. Pero un país es grande y las personas no son todas iguales. En clase uso los estereotipos como punto de partida para conversar, nunca como conclusión.</p>`},
    ru:{h:"Стереотипы",l:"Иногда забавные, но не всегда правдивые.",b:`<p>Стереотип — упрощённое представление о народе или культуре. Говорят, что все итальянцы говорят руками и любят пасту, все аргентинцы танцуют танго, бразильцы всегда весёлые, а немцы очень пунктуальны.</p><p>Во многих есть доля правды: в Италии действительно много жестикулируют, а танго очень важно для Буэнос-Айреса. Но страна большая, и люди не одинаковые. На уроке я использую стереотипы как повод для разговора, а не как вывод.</p>`},
    it:{h:"Stereotipi",l:"A volte divertenti, ma non sempre veri.",b:`<p>Uno stereotipo è un’idea semplice su un popolo o su una cultura. Molti pensano che tutti gli italiani parlino con le mani e amino la pasta, che tutti gli argentini ballino il tango, che i brasiliani siano sempre allegri e i tedeschi molto puntuali.</p><p>Spesso c’è un fondo di verità: in Italia molte persone usano i gesti, e il tango è importante a Buenos Aires. Ma un paese è grande e le persone non sono tutte uguali. In classe uso gli stereotipi per cominciare una conversazione, mai per chiuderla.</p>`},
    en:{h:"Stereotypes",l:"Sometimes funny, but not always true.",b:`<p>A stereotype is a simple idea about a people or a culture. People say all Italians talk with their hands and love pasta, all Argentines dance tango, Brazilians are always cheerful and Germans are very punctual.</p><p>Many contain some truth: Italians do use a lot of gestures, and tango matters a great deal in Buenos Aires. But a country is big and people are not all the same. In class I use stereotypes to start a conversation, never to end it.</p>`}}},

{id:"inglaterra-riqueza",cat:"historia",cult:"en",src:"Outsiders · Prologue, Unit 6",see:["londres","stereotipi"],
 box:{es:[["Revolución Industrial","Siglos XVIII–XIX"],["Factores","Industria, comercio, finanzas, imperio"],["Hoy","Servicios, banca, universidades"]],ru:[["Промышленная революция","XVIII–XIX века"],["Факторы","Промышленность, торговля, финансы, империя"],["Сегодня","Услуги, банки, университеты"]],it:[["Rivoluzione industriale","Secoli XVIII–XIX"],["Fattori","Industria, commercio, finanza, impero"],["Oggi","Servizi, banche, università"]],en:[["Industrial Revolution","18th–19th centuries"],["Factors","Industry, trade, finance, empire"],["Today","Services, banking, universities"]]},
 t:{es:{h:"¿Por qué Inglaterra es tan rica?",l:"Industria, comercio e imperio, mirados desde fuera.",b:`<p>Mi manual de inglés se llama <i>Outsiders</i> porque no pretende elogiar la cultura inglesa en bloque, sino entender el mundo anglófono con curiosidad y con mirada propia.</p><p>La riqueza de Inglaterra tiene varias causas. La <b>Revolución Industrial</b> de los siglos XVIII y XIX trajo fábricas, máquinas y ferrocarriles. El <b>comercio</b> marítimo convirtió a Londres en un gran centro financiero. El <b>Imperio británico</b> aportó recursos y mercados, y esa historia también incluye conquista y explotación.</p><p>Hoy la economía depende sobre todo de los servicios: banca, tecnología, educación, turismo y cultura.</p>`},
    ru:{h:"Почему Англия так богата?",l:"Промышленность, торговля и империя — взгляд со стороны.",b:`<p>Мой учебник английского называется <i>Outsiders</i> («Посторонние»): его цель не восхвалять английскую культуру целиком, а понять англоязычный мир с интересом и собственным взглядом.</p><p>У богатства Англии несколько причин. <b>Промышленная революция</b> XVIII–XIX веков принесла фабрики, машины и железные дороги. Морская <b>торговля</b> сделала Лондон крупным финансовым центром. <b>Британская империя</b> дала ресурсы и рынки, и эта история включает также завоевания и эксплуатацию.</p><p>Сегодня экономика держится прежде всего на услугах: банках, технологиях, образовании, туризме и культуре.</p>`},
    it:{h:"Perché l’Inghilterra è così ricca?",l:"Industria, commercio e impero, visti da fuori.",b:`<p>Il mio manuale d’inglese si chiama <i>Outsiders</i> perché non vuole lodare in blocco la cultura inglese, ma capire il mondo anglofono con curiosità e con uno sguardo proprio.</p><p>La ricchezza dell’Inghilterra ha diverse cause. La <b>Rivoluzione industriale</b> dei secoli XVIII e XIX portò fabbriche, macchine e ferrovie. Il <b>commercio</b> marittimo fece di Londra un grande centro finanziario. L’<b>Impero britannico</b> fornì risorse e mercati, e questa storia comprende anche conquista e sfruttamento.</p><p>Oggi l’economia dipende soprattutto dai servizi: banche, tecnologia, istruzione, turismo e cultura.</p>`},
    en:{h:"Why is England so rich?",l:"Industry, trade and empire, seen from outside.",b:`<p>My English textbook is called <i>Outsiders</i> because it does not set out to praise English culture as a whole. It tries to understand the English-speaking world with curiosity and a perspective of one’s own.</p><p>England’s wealth has several causes. The <b>Industrial Revolution</b> of the 18th and 19th centuries brought factories, machines and railways. Sea <b>trade</b> made London a major financial centre. The <b>British Empire</b> supplied resources and markets, and that history also includes conquest and exploitation.</p><p>Today the economy rests mainly on services: banking, technology, education, tourism and culture.</p>`}}},

{id:"londres",cat:"historia",cult:"en",src:"Outsiders · Unit 7–8",see:["inglaterra-riqueza"],
 box:{es:[["Primer metro","1863"],["Iluminación del XIX","Farolas de gas"],["Ciudades vecinas","Oxford, York, Brighton, Liverpool"]],ru:[["Первое метро","1863"],["Освещение в XIX веке","Газовые фонари"],["Другие города","Оксфорд, Йорк, Брайтон, Ливерпуль"]],it:[["Prima metropolitana","1863"],["Illuminazione nell’Ottocento","Lampioni a gas"],["Altre città","Oxford, York, Brighton, Liverpool"]],en:[["First underground","1863"],["19th-century lighting","Gas lamps"],["Other cities","Oxford, York, Brighton, Liverpool"]]},
 t:{es:{h:"Londres antes y ahora",l:"De los coches de caballos al metro más antiguo del mundo.",b:`<p>En el siglo XIX la gente se movía por Londres en caballo, carruaje u ómnibus. En <b>1863</b> se inauguró el primer ferrocarril subterráneo del mundo, que cambió la forma de desplazarse por la ciudad.</p><p>Las calles eran ruidosas, había mercados callejeros, muelles y fábricas, y de noche las farolas de gas iluminaban la ciudad. Sin televisión ni internet, la gente leía periódicos, libros y cartas.</p><p>Hoy Londres es una ciudad moderna e internacional, pero conserva calles, mercados y estaciones de aquella época.</p>`},
    ru:{h:"Лондон тогда и сейчас",l:"От конных экипажей до старейшего метро в мире.",b:`<p>В XIX веке по Лондону ездили верхом, в каретах и омнибусах. В <b>1863</b> году открылась первая в мире подземная железная дорога, и это изменило передвижение по городу.</p><p>Улицы были шумными, повсюду были уличные рынки, доки и фабрики, а ночью город освещали газовые фонари. Без телевизора и интернета люди читали газеты, книги и письма.</p><p>Сегодня Лондон — современный международный город, но в нём сохранились улицы, рынки и вокзалы той эпохи.</p>`},
    it:{h:"Londra ieri e oggi",l:"Dalle carrozze alla metropolitana più antica del mondo.",b:`<p>Nell’Ottocento a Londra ci si spostava a cavallo, in carrozza o in omnibus. Nel <b>1863</b> fu inaugurata la prima ferrovia sotterranea del mondo, che cambiò il modo di muoversi in città.</p><p>Le strade erano rumorose, c’erano mercati, moli e fabbriche, e di notte la città era illuminata da lampioni a gas. Senza televisione né internet, si leggevano giornali, libri e lettere.</p><p>Oggi Londra è una città moderna e internazionale, ma conserva strade, mercati e stazioni di quell’epoca.</p>`},
    en:{h:"London then and now",l:"From horse-drawn carriages to the world’s oldest underground.",b:`<p>In the 19th century people moved around London by horse, carriage and omnibus. In <b>1863</b> the world’s first underground railway opened and changed how people travelled through the city.</p><p>The streets were busy and noisy, full of markets, docks and factories, and at night gas lamps lit the city. Without television or the Internet, people read newspapers, books and letters.</p><p>Today London is a modern, international city, but you can still see streets, markets and stations from that time.</p>`}}},

{id:"sinea",cat:"universo",cult:"novela",src:"Aquella vez 1 · Unidad 4; Ciao, amore! A1 · Unità 7",see:["ciudad-hispana","venezia","museo-fader"],
 box:{es:[["Tipo","Ciudad imaginaria"],["Barrios","De los locos, de los ricos tristes, de los pobres felices"],["Personajes","Natalia, Roberto, Marcos, Alicia, Luis, Lucy"]],ru:[["Тип","Вымышленный город"],["Районы","Сумасшедших, грустных богачей, счастливых бедняков"],["Персонажи","Наталья, Роберто, Маркос, Алисия, Луис, Люси"]],it:[["Tipo","Città immaginaria"],["Quartieri","Dei pazzi, dei ricchi tristi, dei poveri felici"],["Personaggi","Natalia, Roberto, Marco, Alice, Luis, Lucy"]],en:[["Type","Imaginary city"],["Districts","The mad, the sad rich, the happy poor"],["Characters","Natalia, Roberto, Marcos, Alicia, Luis, Lucy"]]},
 t:{es:{h:"Sinea y los personajes",l:"La ciudad imaginaria de mis novelas que recorre los manuales.",b:`<p>Soy escritor, y en mis manuales aparecen personajes y lugares de mis novelas. Una lengua no vive solo en las reglas, sino también en las personas, las emociones y las historias.</p><p><b>Sinea</b> es una ciudad tranquila pero misteriosa. Tiene una estación central, una plaza con un monumento, metro con estaciones como «Natalia mi amor» y barrios muy distintos: el <b>barrio de los locos</b>, lleno de colores y música; el de los <b>ricos tristes</b> y el de los <b>pobres felices</b>.</p><h2>Personajes que vuelven</h2><ul><li><b>Natalia</b>, la veneciana misteriosa de doscientos años.</li><li><b>Roberto</b>, arqueólogo argentino que vive en Venecia.</li><li><b>Marcos</b>, detective serio, y <b>Alicia</b>, astróloga.</li><li><b>Luis</b>, <b>Lucy</b> y <b>Luciano</b>, que viajan hasta Londres en <i>Outsiders</i>.</li></ul>`},
    ru:{h:"Синея и персонажи",l:"Вымышленный город из моих романов, который проходит через все учебники.",b:`<p>Я писатель, и в моих учебниках живут персонажи и места из моих романов. Язык существует не только в правилах, но и в людях, эмоциях и историях.</p><p><b>Синея</b> — спокойный, но загадочный город. Там есть центральный вокзал, площадь с памятником, метро со станциями вроде «Natalia mi amor» и очень разные районы: <b>район сумасшедших</b>, полный красок и музыки, район <b>грустных богачей</b> и район <b>счастливых бедняков</b>.</p><h2>Сквозные персонажи</h2><ul><li><b>Наталья</b> — таинственная венецианка, которой двести лет.</li><li><b>Роберто</b> — аргентинский археолог, живущий в Венеции.</li><li><b>Маркос</b> — серьёзный детектив, и <b>Алисия</b> — астролог.</li><li><b>Луис</b>, <b>Люси</b> и <b>Лучано</b>, которые в <i>Outsiders</i> оказываются в Лондоне.</li></ul>`},
    it:{h:"Sinea e i personaggi",l:"La città immaginaria dei miei romanzi che attraversa i manuali.",b:`<p>Sono scrittore, e nei miei manuali compaiono personaggi e luoghi dei miei romanzi. Una lingua non vive solo nelle regole, ma anche nelle persone, nelle emozioni e nelle storie.</p><p><b>Sinea</b> è una città calma fuori, ma piena di misteri dentro. Ha una stazione centrale, una piazza con un monumento, una metropolitana con fermate come «Natalia mi amor» e quartieri diversissimi: il <b>quartiere dei pazzi</b>, pieno di colori e musica, quello dei <b>ricchi tristi</b> e quello dei <b>poveri felici</b>.</p><h2>Personaggi che ritornano</h2><ul><li><b>Natalia</b>, la veneziana misteriosa di duecento anni.</li><li><b>Roberto</b>, archeologo argentino che vive a Venezia.</li><li><b>Marco</b>, detective serio, e <b>Alice</b>, astrologa.</li><li><b>Luis</b>, <b>Lucy</b> e <b>Luciano</b>, che in <i>Outsiders</i> arrivano a Londra.</li></ul>`},
    en:{h:"Sinea and the characters",l:"The imaginary city from my novels that runs through the textbooks.",b:`<p>I am a writer, and characters and places from my novels appear in my textbooks. A language lives not only in rules but in people, emotions and stories.</p><p><b>Sinea</b> is a quiet but mysterious city. It has a central station, a square with a monument, an underground with stations like “Natalia mi amor” and very different districts: the <b>district of the mad</b>, full of colour and music, the district of the <b>sad rich</b> and that of the <b>happy poor</b>.</p><h2>Recurring characters</h2><ul><li><b>Natalia</b>, the mysterious two-hundred-year-old Venetian.</li><li><b>Roberto</b>, an Argentine archaeologist living in Venice.</li><li><b>Marcos</b>, a serious detective, and <b>Alicia</b>, an astrologer.</li><li><b>Luis</b>, <b>Lucy</b> and <b>Luciano</b>, who end up in London in <i>Outsiders</i>.</li></ul>`}}},
{id:"ministerio-sentimientos",cat:"ideas",cult:"novela",src:"La città triste · Capitoli 1–3",see:["ley-felicidad","revolucion-risa"],
 box:{es:[["Novela","La città triste"],["Lugar","Sinea"],["Función","Cuidar la felicidad de la gente"],["Empleado","Franco, 24 años"]],ru:[["Роман","La città triste"],["Место","Синея"],["Задача","Заботиться о счастье людей"],["Сотрудник","Франко, 24 года"]],it:[["Romanzo","La città triste"],["Luogo","Sinea"],["Compito","Occuparsi della felicità della gente"],["Impiegato","Franco, 24 anni"]],en:[["Novel","La città triste"],["Place","Sinea"],["Purpose","Looking after people’s happiness"],["Employee","Franco, 24"]]},
 t:{es:{h:"Ministerio de los Sentimientos",l:"Una oficina pública dedicada a que la gente sonría.",b:`<p>En <i>La città triste</i>, Franco trabaja en el <b>Ministerio de los Sentimientos</b>, un ministerio especial que se ocupa de la felicidad de los habitantes de Sinea. Su trabajo consiste en ayudar a las personas a sonreír y a estar bien.</p><p>Todo cambia cuando llega un nuevo presidente que considera peligrosa la alegría. El ministerio deja de cumplir su función y Franco lo abandona. Desde entonces, haber trabajado allí lo convierte en sospechoso: la policía lo detiene en la calle para hacerle preguntas.</p><p>Al final de la novela, el ministerio renace con otro nombre: el <b>Ministerio de las Sonrisas</b>, donde la gente aprende a ser feliz y Marco inventa juegos que hacen reír.</p><h2>Para conversar en clase</h2><p>¿Debería un gobierno ocuparse de la felicidad de las personas? ¿Qué pasa cuando alguien decide qué emociones están permitidas?</p>`},
    ru:{h:"Министерство чувств",l:"Государственное учреждение, которое следит, чтобы люди улыбались.",b:`<p>В романе <i>La città triste</i> Франко работает в <b>Министерстве чувств</b> — особом министерстве, которое заботится о счастье жителей Синеи. Его работа — помогать людям улыбаться и чувствовать себя хорошо.</p><p>Всё меняется, когда приходит новый президент, для которого радость опасна. Министерство перестаёт выполнять свою задачу, и Франко увольняется. С тех пор то, что он там работал, делает его подозрительным: полиция останавливает его на улице и допрашивает.</p><p>В финале министерство возрождается под новым названием — <b>Министерство улыбок</b>, где люди учатся быть счастливыми, а Марко изобретает игры, которые смешат.</p><h2>Для обсуждения на уроке</h2><p>Должно ли государство заниматься счастьем людей? Что происходит, когда кто-то решает, какие эмоции разрешены?</p>`},
    it:{h:"Ministero dei Sentimenti",l:"Un ufficio pubblico che si occupa di far sorridere la gente.",b:`<p>Nella <i>Città triste</i> Franco lavora nel <b>Ministero dei Sentimenti</b>, un ministero speciale che si occupa della felicità degli abitanti di Sinea. Ogni giorno aiuta le persone a sorridere e a stare bene.</p><p>Tutto cambia con il nuovo presidente, per cui la felicità è pericolosa. Il ministero non può più fare il suo lavoro e Franco se ne va. Da quel momento, averci lavorato lo rende sospetto: la polizia lo ferma per strada e gli fa domande.</p><p>Alla fine del romanzo il ministero rinasce con un altro nome: il <b>Ministero dei Sorrisi</b>, dove le persone imparano a essere felici e Marco inventa giochi che fanno ridere.</p><h2>Per parlarne in classe</h2><p>Un governo dovrebbe occuparsi della felicità delle persone? Che cosa succede quando qualcuno decide quali emozioni sono permesse?</p>`},
    en:{h:"Ministry of Feelings",l:"A public office devoted to making people smile.",b:`<p>In <i>La città triste</i>, Franco works at the <b>Ministry of Feelings</b>, a special ministry that looks after the happiness of Sinea’s citizens. His job is to help people smile and feel well.</p><p>Everything changes when a new president decides that joy is dangerous. The ministry can no longer do its work and Franco leaves. From then on, having worked there makes him a suspect: the police stop him in the street to question him.</p><p>At the end of the novel the ministry is reborn under a new name, the <b>Ministry of Smiles</b>, where people learn to be happy and Marco invents games that make them laugh.</p><h2>To discuss in class</h2><p>Should a government care about people’s happiness? What happens when someone decides which emotions are allowed?</p>`}}},

{id:"ley-felicidad",cat:"ideas",cult:"novela",src:"La città triste · Capitoli 1 e 9",see:["ministerio-sentimientos","prohibido-enamorarse"],
 box:{es:[["Antes","Prohibido sonreír en público"],["Después","Ley de la Felicidad"],["Artículo 1","Toda persona tiene derecho a ser feliz"]],ru:[["Раньше","Запрещено улыбаться на людях"],["Потом","Закон о счастье"],["Статья 1","Каждый имеет право быть счастливым"]],it:[["Prima","Vietato sorridere in pubblico"],["Dopo","Legge della Felicità"],["Articolo 1","Ogni persona ha il diritto di essere felice"]],en:[["Before","Smiling in public forbidden"],["After","Law of Happiness"],["Article 1","Everyone has the right to be happy"]]},
 t:{es:{h:"Ley de la Felicidad",l:"De la prohibición de sonreír al derecho a ser feliz.",b:`<p>El presidente de Sinea prohíbe las sonrisas y cualquier muestra de felicidad en lugares públicos. Su lema es que «la felicidad es peligrosa». En el metro nadie habla ni ríe, y sonreír se vuelve ilegal: a un perro le ponen una multa por mover la cola.</p><p>Cuando la ciudad recupera la risa, la primera norma del nuevo gobierno es la <b>Ley de la Felicidad</b>:</p><ul><li>Toda persona tiene derecho a ser feliz.</li><li>Las sonrisas siempre están permitidas.</li><li>Las risas son bienvenidas en todos los lugares.</li></ul><p>Con ella llegan la Fiesta del Sol, una gran fiesta semanal en la plaza, y las Calles de Colores, donde cualquiera puede pintar murales.</p>`},
    ru:{h:"Закон о счастье",l:"От запрета улыбаться к праву быть счастливым.",b:`<p>Президент Синеи запрещает улыбки и любые проявления радости в общественных местах. Его девиз: «счастье опасно». В метро никто не говорит и не смеётся, улыбаться становится незаконно: даже собаку штрафуют за то, что она виляет хвостом.</p><p>Когда город снова начинает смеяться, первым решением новой власти становится <b>Закон о счастье</b>:</p><ul><li>Каждый человек имеет право быть счастливым.</li><li>Улыбки разрешены всегда.</li><li>Смех приветствуется везде.</li></ul><p>Вместе с ним появляются Праздник Солнца, большой еженедельный праздник на площади, и Цветные улицы, где любой может рисовать фрески.</p>`},
    it:{h:"Legge della Felicità",l:"Dal divieto di sorridere al diritto di essere felici.",b:`<p>Il presidente di Sinea vieta i sorrisi e le manifestazioni di felicità nei luoghi pubblici, perché «la felicità è pericolosa». Nella metro nessuno parla e nessuno ride, e sorridere diventa illegale: perfino un cane riceve una multa perché scodinzola.</p><p>Quando la città ritrova la risata, la prima legge del nuovo governo è la <b>Legge della Felicità</b>:</p><ul><li>Ogni persona ha il diritto di essere felice.</li><li>I sorrisi sono sempre permessi.</li><li>Le risate sono benvenute in tutti i luoghi.</li></ul><p>Con lei arrivano la Festa del Sole, una grande festa settimanale in piazza, e le Strade Colorate, dove tutti possono dipingere murales.</p>`},
    en:{h:"Law of Happiness",l:"From a ban on smiling to the right to be happy.",b:`<p>Sinea’s president bans smiles and any sign of happiness in public places, because “happiness is dangerous”. On the metro nobody talks or laughs, and smiling becomes illegal: even a dog is fined for wagging its tail.</p><p>Once the city laughs again, the new government’s first rule is the <b>Law of Happiness</b>:</p><ul><li>Everyone has the right to be happy.</li><li>Smiles are always allowed.</li><li>Laughter is welcome everywhere.</li></ul><p>It brings the Festival of the Sun, a weekly party in the square, and the Colourful Streets, where anyone may paint murals.</p>`}}},

{id:"revolucion-risa",cat:"ideas",cult:"novela",src:"La città triste · Capitoli 3–9",see:["ley-felicidad","ministerio-sentimientos","cupidronas"],
 box:{es:[["Lugar de reunión","Via Roma 10, a las 18:00"],["Contraseña","«El sol es azul»"],["Invento","El Risatomat"],["Resultado","La ciudad elige a Franco y Chiara"]],ru:[["Место встречи","Via Roma 10, в 18:00"],["Пароль","«Солнце синее»"],["Изобретение","Ризатомат"],["Итог","Город выбирает Франко и Кьяру"]],it:[["Luogo","Via Roma 10, ore 18:00"],["Password","«Il sole è blu»"],["Invenzione","Il Risatomat"],["Risultato","La città sceglie Franco e Chiara"]],en:[["Meeting place","Via Roma 10, 6 p.m."],["Password","“The sun is blue”"],["Invention","The Risatomat"],["Outcome","The city chooses Franco and Chiara"]]},
 t:{es:{h:"La revolución de la risa",l:"Cambiar una ciudad con un arma que no hace daño.",b:`<p>En la Sinea triste, la alegría sobrevive a escondidas. Un mensaje secreto convoca una reunión con contraseña: «El sol es azul». Allí la gente sonríe, y un humorista hace chistes sobre el presidente. El humor es la primera forma de libertad.</p><p>Escondidos en un sótano, Franco, Chiara y Marco construyen el <b>Risatomat</b>, una regadera gigante que dispara carcajadas. Franco lo llama «un arma que no hace daño». En la plaza, cuando la policía va a detenerlos, el Risatomat contagia la risa a los policías, a la gente y finalmente al propio presidente, que reconoce su error.</p><p>Es la propia plaza la que pide a Franco como presidente y a Chiara como vicepresidenta, y el Consejo de la Ciudad lo vota. El antiguo presidente abre una heladería.</p>`},
    ru:{h:"Революция смеха",l:"Изменить город оружием, которое не причиняет вреда.",b:`<p>В грустной Синее радость живёт тайком. Секретное письмо созывает собрание с паролем «Солнце синее». Там люди улыбаются, а комик шутит о президенте. Юмор становится первой формой свободы.</p><p>Спрятавшись в подвале, Франко, Кьяра и Марко собирают <b>Ризатомат</b> — огромную лейку, которая стреляет смехом. Франко называет его «оружием, которое не причиняет вреда». На площади, когда полиция пытается их арестовать, Ризатомат заражает смехом полицейских, людей и в конце концов самого президента, который признаёт свою ошибку.</p><p>Сама площадь требует Франко в президенты и Кьяру в вице-президенты, и Городской совет за это голосует. Бывший президент открывает кафе-мороженое.</p>`},
    it:{h:"La rivoluzione della risata",l:"Cambiare una città con un’arma che non fa male.",b:`<p>Nella Sinea triste la gioia sopravvive di nascosto. Un messaggio segreto convoca una riunione con password: «Il sole è blu». Lì la gente sorride e un comico fa battute sul presidente. L’umorismo è la prima forma di libertà.</p><p>Nascosti in un seminterrato, Franco, Chiara e Marco costruiscono il <b>Risatomat</b>, un annaffiatoio gigante che spara risate. Franco lo chiama «un’arma che non fa male». In piazza, quando la polizia sta per arrestarli, il Risatomat contagia i poliziotti, la gente e alla fine lo stesso presidente, che ammette di aver sbagliato.</p><p>È la piazza a chiedere Franco come presidente e Chiara come vicepresidente, e il Consiglio della Città vota. Il vecchio presidente apre una gelateria.</p>`},
    en:{h:"The laughter revolution",l:"Changing a city with a weapon that does no harm.",b:`<p>In sad Sinea, joy survives in hiding. A secret message calls a meeting with a password: “The sun is blue”. There people smile and a comedian jokes about the president. Humour is the first form of freedom.</p><p>Hidden in a basement, Franco, Chiara and Marco build the <b>Risatomat</b>, a giant watering can that fires laughter. Franco calls it “a weapon that does no harm”. In the square, as the police close in, the Risatomat infects the officers, the crowd and finally the president himself, who admits he was wrong.</p><p>The square itself asks for Franco as president and Chiara as vice-president, and the City Council votes for it. The former president opens an ice-cream shop.</p>`}}},

{id:"app-destino",cat:"ideas",cult:"novela",src:"El impostor · Capítulos 1, 6 y 10",see:["prohibido-enamorarse","cupidronas","impostor"],
 box:{es:[["Novela","El impostor"],["Qué es","Una aplicación de horóscopo"],["Usuarias","Casi todas las mujeres de Sinea"],["Mensaje diario","«Responde que no»"],["Dueña","Doña Destino"]],ru:[["Роман","El impostor"],["Что это","Приложение-гороскоп"],["Пользователи","Почти все женщины Синеи"],["Ежедневный совет","«Ответь нет»"],["Владелица","Донья Дестино"]],it:[["Romanzo","El impostor"],["Che cos’è","Un’app di oroscopi"],["Utenti","Quasi tutte le donne di Sinea"],["Messaggio quotidiano","«Rispondi di no»"],["Proprietaria","Doña Destino"]],en:[["Novel","El impostor"],["What it is","A horoscope app"],["Users","Almost every woman in Sinea"],["Daily message","“Say no”"],["Owner","Doña Destino"]]},
 t:{es:{h:"La aplicación Destino",l:"Cuando una pantalla decide por nosotros.",b:`<p>En <i>El impostor</i>, casi todas las mujeres de Sinea leen cada mañana su horóscopo en una aplicación llamada <b>Destino</b>. Un día el mensaje es extraño: «Si un hombre te pide matrimonio, responde que no». Sofía se ríe, pero cuando Leonardo le muestra los anillos, recuerda el horóscopo y dice que no.</p><p>Ese mismo día, ochenta y siete hombres piden matrimonio y ochenta y siete mujeres responden que no. La televisión lo llama una «epidemia de rechazos». Nadie sospecha que detrás no están los planetas, sino la dueña de la aplicación, que escribe los mismos consejos para todas.</p><p>La salida empieza con un gesto pequeño: Sofía y Florencia entienden que «estos horóscopos no los escriben los planetas» y borran la aplicación al mismo tiempo.</p><h2>Para conversar en clase</h2><p>¿Cuántas decisiones tomamos porque nos lo sugiere una pantalla? ¿Quién escribe lo que leemos cada mañana?</p>`},
    ru:{h:"Приложение «Дестино»",l:"Когда экран решает за нас.",b:`<p>В романе <i>El impostor</i> почти все женщины Синеи каждое утро читают гороскоп в приложении <b>Destino</b> («Судьба»). Однажды сообщение странное: «Если мужчина сделает тебе предложение, ответь нет». Софья смеётся, но когда Леонардо показывает кольца, она вспоминает гороскоп и отказывает.</p><p>В тот же день восемьдесят семь мужчин делают предложение, и восемьдесят семь женщин отвечают «нет». Телевидение называет это «эпидемией отказов». Никто не подозревает, что за этим стоят не планеты, а владелица приложения, которая пишет всем одинаковые советы.</p><p>Выход начинается с маленького шага: Софья и Флоренсия понимают, что «эти гороскопы пишут не планеты», и одновременно удаляют приложение.</p><h2>Для обсуждения на уроке</h2><p>Сколько решений мы принимаем, потому что их подсказывает экран? Кто пишет то, что мы читаем каждое утро?</p>`},
    it:{h:"L’app Destino",l:"Quando uno schermo decide per noi.",b:`<p>In <i>El impostor</i>, quasi tutte le donne di Sinea leggono ogni mattina l’oroscopo in un’app che si chiama <b>Destino</b>. Un giorno il messaggio è strano: «Se un uomo ti chiede di sposarlo, rispondi di no». Sofía ride, ma quando Leonardo le mostra gli anelli si ricorda dell’oroscopo e dice di no.</p><p>Quello stesso giorno ottantasette uomini chiedono la mano e ottantasette donne rispondono di no. La televisione parla di «epidemia di rifiuti». Nessuno sospetta che dietro non ci siano i pianeti, ma la proprietaria dell’app, che scrive gli stessi consigli per tutte.</p><p>La via d’uscita comincia con un gesto piccolo: Sofía e Florencia capiscono che «questi oroscopi non li scrivono i pianeti» e cancellano l’app nello stesso momento.</p><h2>Per parlarne in classe</h2><p>Quante decisioni prendiamo perché ce le suggerisce uno schermo? Chi scrive quello che leggiamo ogni mattina?</p>`},
    en:{h:"The Destino app",l:"When a screen decides for us.",b:`<p>In <i>El impostor</i>, almost every woman in Sinea reads her horoscope each morning on an app called <b>Destino</b> (Destiny). One day the message is odd: “If a man asks you to marry him, say no”. Sofía laughs, but when Leonardo shows her the rings she remembers the horoscope and says no.</p><p>That same day, eighty-seven men propose and eighty-seven women say no. The TV calls it an “epidemic of rejections”. Nobody suspects that it is not the planets behind it but the app’s owner, who writes the same advice for everyone.</p><p>The way out starts with a small gesture: Sofía and Florencia realise that “the planets don’t write these horoscopes” and delete the app at the same moment.</p><h2>To discuss in class</h2><p>How many decisions do we make because a screen suggests them? Who writes what we read every morning?</p>`}}},

{id:"prohibido-enamorarse",cat:"ideas",cult:"novela",src:"El impostor · Capítulos 7, 10 y 14",see:["app-destino","cupidronas","ley-felicidad"],
 box:{es:[["Texto","«Desde hoy está prohibido enamorarse»"],["Firmado como","Decreto de la alcaldesa"],["La alcaldesa real","Encerrada en el sótano"],["Se difunde por","Pantallas, televisión, semáforos"]],ru:[["Текст","«С сегодняшнего дня влюбляться запрещено»"],["Подписан как","Указ мэра"],["Настоящий мэр","Заперта в подвале"],["Распространяется через","Экраны, телевидение, светофоры"]],it:[["Testo","«Da oggi è vietato innamorarsi»"],["Firmato come","Decreto della sindaca"],["La vera sindaca","Chiusa in cantina"],["Diffuso su","Schermi, televisione, semafori"]],en:[["Text","“From today, falling in love is forbidden”"],["Signed as","The mayor’s decree"],["The real mayor","Locked in the basement"],["Spread through","Screens, TV, traffic lights"]]},
 t:{es:{h:"Prohibido enamorarse",l:"Un decreto que aparece a la vez en todas las pantallas.",b:`<p>Un día, en todas las pantallas de Sinea, en los teléfonos, en la televisión y hasta en los semáforos, aparece un mensaje: «Decreto de la alcaldesa. Desde hoy está prohibido enamorarse. Está prohibido casarse. Todos los ciudadanos deben pensar solo en su trabajo».</p><p>La alcaldesa no sabe nada: Doña Destino la tiene encerrada en el sótano del ayuntamiento y controla las pantallas, las noticias y las redes sociales. Quien controla lo que la ciudad ve, puede hacer que una orden falsa parezca oficial.</p><p>Al principio a algunos les gusta el orden y la tranquilidad, pero pronto Sinea se vuelve eficiente, gris y silenciosa. Al final, Sofía resume la lección: «El amor no es un decreto. Tampoco es un horóscopo ni un algoritmo. Es torpe, desordenado, a veces muy gracioso… y es nuestro».</p>`},
    ru:{h:"Влюбляться запрещено",l:"Указ, который одновременно появляется на всех экранах.",b:`<p>Однажды на всех экранах Синеи, в телефонах, по телевизору и даже на светофорах появляется сообщение: «Указ мэра. С сегодняшнего дня влюбляться запрещено. Жениться запрещено. Все граждане должны думать только о работе».</p><p>Мэр ничего об этом не знает: Донья Дестино заперла её в подвале мэрии и контролирует экраны, новости и социальные сети. Тот, кто управляет тем, что видит город, может выдать ложный приказ за официальный.</p><p>Сначала кому-то нравятся порядок и спокойствие, но скоро Синея становится эффективной, серой и молчаливой. В конце Софья подводит итог: «Любовь — не указ. И не гороскоп, и не алгоритм. Она неуклюжая, беспорядочная, иногда очень смешная… и она наша».</p>`},
    it:{h:"Vietato innamorarsi",l:"Un decreto che appare insieme su tutti gli schermi.",b:`<p>Un giorno, su tutti gli schermi di Sinea, sui telefoni, in televisione e perfino sui semafori, appare un messaggio: «Decreto della sindaca. Da oggi è vietato innamorarsi. È vietato sposarsi. Tutti i cittadini devono pensare solo al lavoro».</p><p>La sindaca non ne sa niente: Doña Destino l’ha chiusa nella cantina del municipio e controlla gli schermi, le notizie e i social. Chi controlla quello che la città vede può far sembrare ufficiale un ordine falso.</p><p>All’inizio a qualcuno piacciono l’ordine e la calma, ma presto Sinea diventa efficiente, grigia e silenziosa. Alla fine Sofía riassume la lezione: «L’amore non è un decreto. Non è un oroscopo né un algoritmo. È goffo, disordinato, a volte molto buffo… ed è nostro».</p>`},
    en:{h:"Falling in love forbidden",l:"A decree that appears on every screen at once.",b:`<p>One day, on every screen in Sinea, on phones, on TV and even on traffic lights, a message appears: “Decree of the mayor. From today, falling in love is forbidden. Marriage is forbidden. All citizens must think only of their work”.</p><p>The mayor knows nothing about it: Doña Destino has locked her in the town-hall basement and controls the screens, the news and social media. Whoever controls what a city sees can make a fake order look official.</p><p>At first some people like the order and calm, but soon Sinea becomes efficient, grey and silent. In the end Sofía sums up the lesson: “Love is not a decree. Nor a horoscope, nor an algorithm. It is clumsy, messy, sometimes very funny… and it is ours”.</p>`}}},

{id:"cupidronas",cat:"ideas",cult:"novela",src:"El impostor · Capítulos 8–14; La città triste · Capitolo 5",see:["prohibido-enamorarse","revolucion-risa"],
 box:{es:[["Qué son","Robots con forma de mujer"],["Ojos","Rojos; amarillos cuando se ríen"],["Vigilan","Suspiros, manos tomadas, flores"],["Punto débil","El humor"]],ru:[["Что это","Роботы в женском облике"],["Глаза","Красные; жёлтые, когда смеются"],["Следят за","Вздохами, руками, цветами"],["Слабое место","Юмор"]],it:[["Che cosa sono","Robot dalla forma femminile"],["Occhi","Rossi; gialli quando ridono"],["Sorvegliano","Sospiri, mani intrecciate, fiori"],["Punto debole","L’umorismo"]],en:[["What they are","Robots shaped like women"],["Eyes","Red; yellow when they laugh"],["They watch","Sighs, held hands, flowers"],["Weak spot","Humour"]]},
 t:{es:{h:"Las Cupidronas",l:"Vigilantes que no entienden un chiste.",b:`<p>En <i>El impostor</i>, Doña Destino crea las <b>Cupidronas</b>, robots plateados con forma de mujer y ojos rojos. Patrullan Sinea en grupos de tres. Si un hombre suspira por amor, si una pareja se toma de la mano o si alguien compra flores, las Cupidronas lo saben. Un alumno del taller recibe una multa por silbar ópera en el autobús.</p><p>Su punto débil es inesperado: el humor. Cuando Andrés Cortés hace el ridículo delante de ellas, sus luces pasan de rojo a amarillo y se ríen. Los chistes malos de Daniel y las bromas de Sofía y Florencia las dejan sentadas en el suelo, confundidas.</p><h2>Un eco en otra novela</h2><p>En <i>La città triste</i> la misma idea tiene otro nombre: la <b>Policía de los Sentimientos</b>, que persigue a quien ríe y dispara pintura negra para marcar a los «transgresores». Al final, también los policías sonríen y ayudan a la gente.</p>`},
    ru:{h:"Купидроны",l:"Надзиратели, которые не понимают шуток.",b:`<p>В романе <i>El impostor</i> Донья Дестино создаёт <b>Купидрон</b> — серебристых роботов в женском облике с красными глазами. Они патрулируют Синею по трое. Если мужчина вздыхает о любви, если пара держится за руки или кто-то покупает цветы, Купидроны об этом знают. Один ученик получает штраф за то, что насвистывал оперу в автобусе.</p><p>Их слабое место неожиданное — юмор. Когда Андрес Кортес выставляет себя на посмешище, их огни меняются с красного на жёлтый, и они смеются. Плохие шутки Даниэля и шутки Софьи и Флоренсии заставляют их растерянно сесть на пол.</p><h2>Отголосок в другом романе</h2><p>В <i>La città triste</i> та же идея называется иначе: <b>Полиция чувств</b>, которая преследует тех, кто смеётся, и стреляет чёрной краской, чтобы пометить «нарушителей». В конце и полицейские улыбаются и помогают людям.</p>`},
    it:{h:"Le Cupidronas",l:"Sorveglianti che non capiscono una battuta.",b:`<p>In <i>El impostor</i> Doña Destino crea le <b>Cupidronas</b>, robot argentati dalla forma femminile con gli occhi rossi. Pattugliano Sinea in gruppi di tre. Se un uomo sospira d’amore, se una coppia si tiene per mano o se qualcuno compra dei fiori, le Cupidronas lo sanno. Un allievo del corso prende una multa per aver fischiettato l’opera sull’autobus.</p><p>Il loro punto debole è inatteso: l’umorismo. Quando Andrés Cortés si rende ridicolo davanti a loro, le luci passano dal rosso al giallo e ridono. Le battute pessime di Daniel e gli scherzi di Sofía e Florencia le lasciano sedute per terra, confuse.</p><h2>Un’eco in un altro romanzo</h2><p>Nella <i>Città triste</i> la stessa idea ha un altro nome: la <b>Polizia dei Sentimenti</b>, che insegue chi ride e spara vernice nera per segnare i «trasgressori». Alla fine anche i poliziotti sorridono e aiutano la gente.</p>`},
    en:{h:"The Cupidronas",l:"Watchers who don’t get a joke.",b:`<p>In <i>El impostor</i>, Doña Destino builds the <b>Cupidronas</b>, silver robots shaped like women with red eyes. They patrol Sinea in threes. If a man sighs with love, if a couple holds hands or someone buys flowers, the Cupidronas know. One student gets a fine for whistling opera on the bus.</p><p>Their weak spot is unexpected: humour. When Andrés Cortés makes a fool of himself in front of them, their lights turn from red to yellow and they laugh. Daniel’s terrible jokes and Sofía and Florencia’s teasing leave them sitting on the floor, confused.</p><h2>An echo in another novel</h2><p>In <i>La città triste</i> the same idea has another name: the <b>Police of Feelings</b>, who chase anyone who laughs and fire black paint to mark “offenders”. In the end the officers smile and help people too.</p>`}}},

{id:"extractor",cat:"ideas",cult:"novela",src:"Los Sueños y la Bestia · Capítulos 7–19",see:["acuerdo-con-uno-mismo","prohibido-enamorarse"],
 box:{es:[["Novela","Los Sueños y la Bestia"],["Inventor","Dr. Krane"],["Máquina","El Extractor, un dron con forma de medusa"],["Lo llama","«Limpieza mental»"],["Efecto","Gente tranquila pero vacía"]],ru:[["Роман","Los Sueños y la Bestia"],["Изобретатель","Доктор Крейн"],["Машина","Экстрактор, дрон в форме медузы"],["Он называет это","«Очистка сознания»"],["Эффект","Люди спокойны, но пусты"]],it:[["Romanzo","Los Sueños y la Bestia"],["Inventore","Dr. Krane"],["Macchina","L’Estrattore, un drone a forma di medusa"],["Lo chiama","«Pulizia mentale»"],["Effetto","Gente calma ma vuota"]],en:[["Novel","Los Sueños y la Bestia"],["Inventor","Dr Krane"],["Machine","The Extractor, a jellyfish-shaped drone"],["He calls it","“Mental cleansing”"],["Effect","People calm but empty"]]},
 t:{es:{h:"El Extractor",l:"Quitarle a una ciudad sus sueños para hacerla «eficiente».",b:`<p>En <i>Los Sueños y la Bestia</i>, el Dr. Krane trabaja en un laboratorio escondido en una isla. Su teoría parece razonable: el subconsciente causa sueños, miedos y deseos confusos; si se extrae, la humanidad será lógica, pacífica y eficiente. Pero lo que de verdad busca es poder: quien controle esa energía, controlará el mundo.</p><p>Su dron, <b>el Extractor</b>, sobrevuela Sinea y quita a la gente la chispa interior: la inspiración, el presentimiento, el recuerdo emocionado. Krane lo llama «limpieza mental». La gente se siente más liviana y menos preocupada, pero vacía.</p><p>Con la energía robada nace la Bestia. Krane bloquea las comunicaciones y Sinea queda aislada del mundo. Al final, cuando todo se resuelve, la versión pública es la de un «ataque terrorista extraño», y los verdaderos héroes quedan en el anonimato.</p>`},
    ru:{h:"Экстрактор",l:"Отнять у города сны, чтобы сделать его «эффективным».",b:`<p>В романе <i>Los Sueños y la Bestia</i> доктор Крейн работает в лаборатории, спрятанной на острове. Его теория звучит разумно: подсознание порождает сны, страхи и путаные желания; если его извлечь, человечество станет логичным, мирным и эффективным. Но на самом деле он хочет власти: кто управляет этой энергией, тот управляет миром.</p><p>Его дрон, <b>Экстрактор</b>, летает над Синеей и отнимает у людей внутреннюю искру: вдохновение, предчувствие, трогательное воспоминание. Крейн называет это «очисткой сознания». Людям становится легче и спокойнее, но пусто.</p><p>Из украденной энергии рождается Чудовище. Крейн блокирует связь, и Синея оказывается отрезанной от мира. Когда всё заканчивается, официальная версия — «странный теракт», а настоящие герои остаются неизвестными.</p>`},
    it:{h:"L’Estrattore",l:"Togliere i sogni a una città per renderla «efficiente».",b:`<p>In <i>Los Sueños y la Bestia</i> il Dr. Krane lavora in un laboratorio nascosto su un’isola. La sua teoria sembra ragionevole: il subconscio causa sogni, paure e desideri confusi; se lo si estrae, l’umanità sarà logica, pacifica ed efficiente. Ma quello che cerca davvero è il potere: chi controlla quell’energia controlla il mondo.</p><p>Il suo drone, <b>l’Estrattore</b>, sorvola Sinea e toglie alla gente la scintilla interiore: l’ispirazione, il presentimento, il ricordo che commuove. Krane la chiama «pulizia mentale». Le persone si sentono più leggere e meno preoccupate, ma vuote.</p><p>Dall’energia rubata nasce la Bestia. Krane blocca le comunicazioni e Sinea resta isolata dal mondo. Alla fine la versione ufficiale parla di uno «strano attacco terroristico», e i veri eroi restano anonimi.</p>`},
    en:{h:"The Extractor",l:"Taking a city’s dreams away to make it “efficient”.",b:`<p>In <i>Los Sueños y la Bestia</i>, Dr Krane works in a lab hidden on an island. His theory sounds reasonable: the subconscious causes dreams, fears and confused desires; remove it and humanity will be logical, peaceful and efficient. What he really wants is power: whoever controls that energy controls the world.</p><p>His drone, <b>the Extractor</b>, flies over Sinea and takes away people’s inner spark: inspiration, hunches, moving memories. Krane calls it “mental cleansing”. People feel lighter and less worried, but empty.</p><p>The stolen energy gives birth to the Beast. Krane blocks all communications and Sinea is cut off from the world. When it is over, the public version is a “strange terrorist attack”, and the real heroes stay anonymous.</p>`}}},

{id:"acuerdo-con-uno-mismo",cat:"ideas",cult:"novela",src:"Los Sueños y la Bestia · Capítulos 2, 6 y 13",see:["extractor"],
 box:{es:[["Idea de","Luciana"],["Imagen","El sótano de la mente"],["Método","Escuchar, no luchar"],["Forma final","La Guerrera Rosa y el Guerrero Brutal"]],ru:[["Идея","Лусианы"],["Образ","Подвал разума"],["Метод","Слушать, а не бороться"],["Итоговый облик","Розовая Воительница и Свирепый Воин"]],it:[["Idea di","Luciana"],["Immagine","La cantina della mente"],["Metodo","Ascoltare, non lottare"],["Forma finale","La Guerriera Rosa e il Guerriero Brutale"]],en:[["Idea by","Luciana"],["Image","The basement of the mind"],["Method","Listen, don’t fight"],["Final form","The Pink Warrior and the Brutal Warrior"]]},
 t:{es:{h:"Un acuerdo con uno mismo",l:"No luchar contra el mundo interior, sino escucharlo.",b:`<p>Luciana imagina el subconsciente como un <b>sótano enorme</b> donde guardamos recuerdos de la infancia, canciones olvidadas, el perfume de la abuela y las partes de nosotros que no mostramos a nadie.</p><p>Mucha gente habla de luchar contra sus miedos. Luciana no: ella se pone de acuerdo con su subconsciente, como con un compañero de piso. «El miedo también es información. Si lo escuchas, te dice qué es importante para ti». No es valentía, dice, es paz.</p><p>Esa idea salva a Sinea. Cuando el Extractor se lleva el mundo interior de la ciudad, Luciana no lucha: escucha, y su subconsciente aparece como la Guerrera Rosa. Celestio, que siempre tuvo esa puerta cerrada con llave, la abre gracias a un beso, y surge el Guerrero Brutal.</p>`},
    ru:{h:"Договор с самим собой",l:"Не бороться со своим внутренним миром, а слушать его.",b:`<p>Лусиана представляет подсознание как <b>огромный подвал</b>, где хранятся детские воспоминания, забытые песни, запах бабушкиных духов и те части нас, которые мы никому не показываем.</p><p>Многие говорят о борьбе со своими страхами. Лусиана — нет: она договаривается со своим подсознанием, как с соседом по квартире. «Страх — это тоже информация. Если его выслушать, он скажет, что для тебя важно». Это не смелость, говорит она, это покой.</p><p>Эта идея спасает Синею. Когда Экстрактор отнимает у города внутренний мир, Лусиана не борется, а слушает, и её подсознание появляется в облике Розовой Воительницы. Селестио, у которого эта дверь всегда была заперта, открывает её благодаря поцелую, и появляется Свирепый Воин.</p>`},
    it:{h:"Un accordo con se stessi",l:"Non combattere il mondo interiore, ma ascoltarlo.",b:`<p>Luciana immagina il subconscio come una <b>cantina enorme</b>, dove teniamo i ricordi d’infanzia, le canzoni dimenticate, il profumo della nonna e le parti di noi che non mostriamo a nessuno.</p><p>Molti parlano di lottare contro le proprie paure. Luciana no: si mette d’accordo con il suo subconscio, come con un coinquilino. «Anche la paura è un’informazione. Se la ascolti, ti dice che cosa è importante per te». Non è coraggio, dice, è pace.</p><p>Quest’idea salva Sinea. Quando l’Estrattore porta via il mondo interiore della città, Luciana non lotta: ascolta, e il suo subconscio appare come la Guerriera Rosa. Celestio, che aveva sempre tenuto chiusa quella porta, la apre grazie a un bacio, e nasce il Guerriero Brutale.</p>`},
    en:{h:"An agreement with yourself",l:"Not fighting your inner world, but listening to it.",b:`<p>Luciana pictures the subconscious as a <b>huge basement</b> where we keep childhood memories, forgotten songs, our grandmother’s perfume and the parts of ourselves we show no one.</p><p>Many people talk about fighting their fears. Luciana doesn’t: she reaches an agreement with her subconscious, like with a flatmate. “Fear is information too. If you listen, it tells you what matters to you”. It isn’t courage, she says, it’s peace.</p><p>That idea saves Sinea. When the Extractor takes away the city’s inner world, Luciana doesn’t fight: she listens, and her subconscious appears as the Pink Warrior. Celestio, who always kept that door locked, opens it thanks to a kiss, and the Brutal Warrior emerges.</p>`}}},

{id:"impostor",cat:"ideas",cult:"novela",src:"El impostor · Capítulos 4–6, 9, 15",see:["app-destino","stereotipi"],
 box:{es:[["Se presenta como","Andrés Cortés, experto en amor"],["Nombre real","Aníbal Benítez"],["Título","«Doctor en Amorología», de internet"],["Lo desenmascara","La revista Desenmascarando"]],ru:[["Представляется","Андрес Кортес, эксперт по любви"],["Настоящее имя","Анибаль Бенитес"],["Диплом","«Доктор аморологии» из интернета"],["Разоблачает","Журнал Desenmascarando"]],it:[["Si presenta come","Andrés Cortés, esperto d’amore"],["Vero nome","Aníbal Benítez"],["Titolo","«Dottore in Amorologia», su internet"],["Lo smaschera","La rivista Desenmascarando"]],en:[["Presents himself as","Andrés Cortés, love expert"],["Real name","Aníbal Benítez"],["Degree","“Doctor of Amorology”, online"],["Exposed by","Desenmascarando magazine"]]},
 t:{es:{h:"El falso experto",l:"Andrés Cortés, o cómo reconocer a un vendedor de soluciones.",b:`<p>Cuando Sinea sufre la «epidemia de rechazos», aparece en televisión <b>Andrés Cortés</b>, «experto en relaciones amorosas». Promete enseñar a conquistar a una mujer en tres días y devolver el doble del dinero si no funciona. Sus lecciones son absurdas, como silbar ópera, y siempre termina pidiendo el «bono avanzado».</p><p>Juan Carlos desconfía y busca su nombre en internet. Una pequeña revista, <i>Desenmascarando</i>, cuenta la verdad: se llama Aníbal Benítez, vendía cremas contra la calvicie y su título viene de una universidad de internet. La revista lo resume así: diez por ciento psicólogo, veinte por ciento showman y setenta por ciento aire perfumado.</p><p>Para entrar a ver a Doña Destino, Andrés le dice que es su gran admirador. Al final los alumnos le exigen que devuelva el dinero, y él se va de Sinea en moto, seguramente para abrir otro taller en otra ciudad.</p>`},
    ru:{h:"Ложный эксперт",l:"Андрес Кортес, или как распознать продавца готовых решений.",b:`<p>Когда в Синее начинается «эпидемия отказов», по телевизору появляется <b>Андрес Кортес</b>, «эксперт по любовным отношениям». Он обещает за три дня научить покорять женщин и вернуть двойную цену, если не получится. Его уроки абсурдны, например насвистывать оперу, и каждый раз он предлагает купить «продвинутый курс».</p><p>Хуан Карлос не доверяет ему и ищет его имя в интернете. Маленький журнал <i>Desenmascarando</i> («Разоблачение») рассказывает правду: его зовут Анибаль Бенитес, раньше он продавал кремы от облысения, а диплом получил в интернет-университете. Журнал подводит итог: десять процентов психолога, двадцать процентов шоумена и семьдесят процентов надушенного воздуха.</p><p>Чтобы попасть к Донье Дестино, Андрес называет себя её большим поклонником. В конце ученики требуют вернуть деньги, и он уезжает из Синеи на мотоцикле — наверное, чтобы открыть курсы в другом городе.</p>`},
    it:{h:"Il falso esperto",l:"Andrés Cortés, o come riconoscere un venditore di soluzioni.",b:`<p>Quando Sinea soffre l’«epidemia di rifiuti», in televisione appare <b>Andrés Cortés</b>, «esperto di relazioni amorose». Promette di insegnare a conquistare una donna in tre giorni e di restituire il doppio se non funziona. Le sue lezioni sono assurde, come fischiettare l’opera, e finisce sempre chiedendo di pagare il «bonus avanzato».</p><p>Juan Carlos non si fida e cerca il suo nome su internet. Una piccola rivista, <i>Desenmascarando</i>, racconta la verità: si chiama Aníbal Benítez, vendeva creme contro la calvizie e il suo titolo viene da un’università online. La rivista lo riassume così: dieci per cento psicologo, venti per cento showman e settanta per cento aria profumata.</p><p>Per farsi ricevere da Doña Destino, Andrés le dice di essere un suo grande ammiratore. Alla fine gli allievi pretendono i loro soldi, e lui lascia Sinea in moto, probabilmente per aprire un altro corso in un’altra città.</p>`},
    en:{h:"The false expert",l:"Andrés Cortés, or how to spot a seller of quick fixes.",b:`<p>When Sinea suffers its “epidemic of rejections”, <b>Andrés Cortés</b>, “relationship expert”, appears on TV. He promises to teach men to win a woman’s heart in three days and to pay back double if it fails. His lessons are absurd, like whistling opera, and he always ends by asking for the “advanced package”.</p><p>Juan Carlos is suspicious and looks him up online. A small magazine, <i>Desenmascarando</i> (Unmasking), tells the truth: his name is Aníbal Benítez, he used to sell anti-baldness creams and his degree comes from an online university. The magazine sums him up: ten per cent psychologist, twenty per cent showman and seventy per cent perfumed air.</p><p>To get an audience with Doña Destino, Andrés tells her he is her greatest admirer. In the end his students make him refund them, and he leaves Sinea on a motorbike, no doubt to open another course in another city.</p>`}}}
];


const LANGS=["es","ru","it","en"];
let lang="es",cat=null,cult=null,q="",cur=null;
try{const s=localStorage.getItem("ef-lang");if(UI[s])lang=s;}catch(e){}
A.forEach((a,i)=>a.n=i+1);
const $=id=>document.getElementById(id);
const strip=h=>h.replace(/<[^>]+>/g," ");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const key=a=>a.t[lang].h.replace(/^[^\p{L}]+/u,"");
const initial=a=>{const c=key(a).charAt(0).toLocaleUpperCase(lang);return norm(c).toUpperCase()||c;};
const sorted=()=>A.slice().sort((x,y)=>key(x).localeCompare(key(y),lang));
function visible(){const nq=norm(q.trim());return sorted().filter(a=>(!cat||a.cat===cat)&&(!cult||a.cult===cult)&&(!nq||norm(a.t[lang].h+" "+a.t[lang].l+" "+strip(a.t[lang].b)).includes(nq)));}

function homeView(){
  const U=UI[lang],list=visible();
  const groups=[];list.forEach(a=>{const L=initial(a);let g=groups.find(x=>x.L===L);if(!g)groups.push(g={L,items:[]});g.items.push(a);});
  const tabs=(obj,state,attr,dotted)=>`<button type="button" class="tab" data-${attr}="" aria-pressed="${state===null}">${U.all}</button>`+Object.entries(obj).map(([k,v])=>`<button type="button" class="tab ${dotted?k:""}" data-${attr}="${k}" aria-pressed="${state===k}">${dotted?'<span class="dot"></span>':""}${v}</button>`).join("");
  return `<section class="mast"><div class="in">
    <h1>Enciclopedia <em>Fader</em></h1>
    <div class="sub"><p>${U.intro}</p><div class="facts mono"><span><b>${A.length}</b> ${U.entries}</span><span><b>4</b> ${U.langs}</span><span><b>6</b> ${U.books}</span></div></div>
  </div></section>
  <div class="in">
    <div class="filters">
      <div class="fgroup"><span class="lab mono">${U.cult}</span>${tabs(U.cults,cult,"cult",true)}</div>
      <div class="fgroup"><span class="lab mono">${U.cat}</span>${tabs(U.cats,cat,"cat",false)}</div>
    </div>
    <nav class="thumbs" aria-label="A–Z">${groups.map(g=>`<a href="#inicio" data-jump="${g.L}">${g.L}</a>`).join("")}</nav>
    ${list.length?`<div class="dict">${groups.map(g=>`<section class="letter" id="L-${g.L}"><h2>${g.L}</h2>${g.items.map(a=>`<button type="button" class="entry ${a.cult}" data-go="${a.id}"><span class="hw">${a.t[lang].h}</span><span class="tag mono"><span class="dot"></span>${U.cats[a.cat].toLowerCase()}</span><span class="def">${a.t[lang].l}</span></button>`).join("")}</section>`).join("")}</div>`:`<p class="none">${U.none}</p>`}
  </div>`;
}
function artView(a){
  const U=UI[lang],T=a.t[lang],S=sorted(),i=S.indexOf(a),prev=S[(i-1+S.length)%S.length],next=S[(i+1)%S.length];
  return `<article class="art"><div class="in">
    <button type="button" class="back mono" data-home>${U.back}</button>
    <h1>${T.h}</h1>
    <div class="tr">${LANGS.map(l=>`<button type="button" data-lang="${l}" aria-current="${l===lang}"><span class="l mono">${l.toUpperCase()}</span><span class="w">${a.t[l].h}</span></button>`).join("")}</div>
    <div class="meta mono ${a.cult}"><span><span class="dot"></span>${U.cults[a.cult]}</span><span>${U.cats[a.cat]}</span><span>N.º ${String(a.n).padStart(2,"0")}</span></div>
    <p class="lede">${T.l}</p>
    <div class="cols">
      <div class="text">${T.b}
        <div class="see"><span class="lab mono">${U.see}</span><ul>${a.see.map(id=>A.find(x=>x.id===id)).filter(Boolean).map(s=>`<li><a href="#${s.id}" data-go="${s.id}">${s.t[lang].h}</a></li>`).join("")}</ul></div>
      </div>
      <aside class="card" aria-label="${U.card}"><span class="kind mono ${a.cult}"><span class="dot"></span>${U.card}</span><span class="no mono">N.º ${String(a.n).padStart(2,"0")}</span>
        <dl>${a.box[lang].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
        <div class="src mono">${U.src}: ${a.src}</div>
      </aside>
    </div>
    <nav class="pager"><button type="button" data-go="${prev.id}"><span class="mono">${U.prev}</span><span class="w">${prev.t[lang].h}</span></button><button type="button" data-go="${next.id}"><span class="mono">${U.next}</span><span class="w">${next.t[lang].h}</span></button></nav>
  </div></article>`;
}
function render(keepScroll){
  const U=UI[lang],v=$("view");
  document.documentElement.lang=lang;
  $("q").placeholder=U.search;$("q").setAttribute("aria-label",U.search);$("foot").textContent=U.foot;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  const a=cur&&A.find(x=>x.id===cur);
  v.innerHTML=a?artView(a):homeView();
  v.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();go(el.dataset.go);}));
  v.querySelectorAll("[data-home]").forEach(el=>el.onclick=()=>go(null));
  v.querySelectorAll("[data-lang]").forEach(el=>el.onclick=()=>setLang(el.dataset.lang));
  v.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{cat=el.dataset.cat||null;render(true);});
  v.querySelectorAll("[data-cult]").forEach(el=>el.onclick=()=>{cult=el.dataset.cult||null;render(true);});
  v.querySelectorAll("[data-jump]").forEach(el=>el.onclick=e=>{e.preventDefault();const t=document.getElementById("L-"+el.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});});
  if(!keepScroll)window.scrollTo(0,0);
}
function go(id){cur=id&&A.some(a=>a.id===id)?id:null;q=cur?q:q;try{history.replaceState(null,"","#"+(cur||"inicio"));}catch(e){}render(false);}
function setLang(l){lang=l;try{localStorage.setItem("ef-lang",l)}catch(e){}render(true);}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("q").addEventListener("input",e=>{q=e.target.value;if(cur){cur=null;try{history.replaceState(null,"","#inicio")}catch(_){}}render(true);const el=$("q");el.focus();});
$("home").onclick=e=>{e.preventDefault();q="";$("q").value="";go(null);};
go((location.hash||"").slice(1)||null);
</script>
