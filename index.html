 box:{es:[["Abarca","Países americanos de lengua española"],["No incluye","Brasil, Haití, Guayana Francesa"],["Términos vecinos","Iberoamérica, Latinoamérica"],["Norma","Diccionario panhispánico de dudas"]],

 t:{es:{h:"Hispanoamérica",l:"Por qué digo «Hispanoamérica» y no «Latinoamérica» cuando hablo del español.",b:`<p>Cuando hablamos de la lengua española, el término preciso es <b>Hispanoamérica</b>: el conjunto de países americanos donde se habla español, de México a Argentina, más Cuba, Puerto Rico y República Dominicana.</p><p><b>Latinoamérica</b> es un concepto más amplio. Reúne a los países americanos de lenguas latinas: español, portugués y francés. Por eso incluye a Brasil y a Haití, donde no se habla español. El término nació en el siglo XIX en el ámbito francés. <b>Iberoamérica</b> suma Hispanoamérica y Brasil, y a veces también España y Portugal.</p><blockquote>La RAE recomienda usar «Hispanoamérica» para referirse solo a los países de lengua española, e «Iberoamérica» si se incluye Brasil.</blockquote><h2>En clase</h2><p>En mis manuales escribo «en España se usa vosotros; en Hispanoamérica, ustedes» o «la zeta se pronuncia como S en Hispanoamérica». Decir «en Latinoamérica» en esas frases sería incorrecto: en Brasil no se dice «ustedes» porque allí se habla portugués.</p>`},
    ru:{h:"Испанская Америка (Hispanoamérica)",l:"Почему, говоря об испанском языке, я говорю «Hispanoamérica», а не «Latinoamérica».",b:`<p>Когда речь идёт об испанском языке, точный термин — <b>Hispanoamérica</b> (Испанская Америка): страны Америки, где говорят по-испански, от Мексики до Аргентины, а также Куба, Пуэрто-Рико и Доминиканская Республика.</p><p><b>Latinoamérica</b> (Латинская Америка) — понятие шире. Оно объединяет страны Америки с романскими языками: испанским, португальским и французским. Поэтому сюда входят Бразилия и Гаити, где по-испански не говорят. Термин возник в XIX веке во французской среде. <b>Iberoamérica</b> (Ибероамерика) — это Испанская Америка плюс Бразилия, иногда также Испания и Португалия.</p><blockquote>Испанская королевская академия рекомендует говорить «Hispanoamérica», когда речь только об испаноязычных странах, и «Iberoamérica», если включается Бразилия.</blockquote><h2>На уроке</h2><p>В учебниках я пишу: «в Испании говорят vosotros, в Испанской Америке — ustedes» или «буква Z в Испанской Америке читается как S». Сказать здесь «в Латинской Америке» было бы неверно: в Бразилии не говорят «ustedes», там говорят по-португальски.</p>`},
    it:{h:"Ispanoamerica",l:"Perché quando parlo dello spagnolo dico «Ispanoamerica» e non «America Latina».",b:`<p>Quando parliamo della lingua spagnola, il termine preciso è <b>Ispanoamerica</b> (in spagnolo <i>Hispanoamérica</i>): l’insieme dei paesi americani in cui si parla spagnolo, dal Messico all’Argentina, più Cuba, Porto Rico e Repubblica Dominicana.</p><p><b>America Latina</b> è un concetto più ampio. Riunisce i paesi americani di lingue neolatine: spagnolo, portoghese e francese. Per questo include il Brasile e Haiti, dove non si parla spagnolo. Il termine nasce nell’Ottocento in ambito francese. <b>Iberoamerica</b> somma l’Ispanoamerica e il Brasile, a volte anche Spagna e Portogallo.</p><blockquote>La Real Academia Española consiglia «Hispanoamérica» per i soli paesi di lingua spagnola e «Iberoamérica» se si include il Brasile.</blockquote><h2>In classe</h2><p>Nei miei manuali scrivo «in Spagna si usa vosotros; in Ispanoamerica, ustedes». Dire qui «in America Latina» sarebbe sbagliato: in Brasile non si dice «ustedes», perché si parla portoghese.</p>`},
    en:{h:"Spanish America (Hispanoamérica)",l:"Why I say “Hispanoamérica” and not “Latin America” when talking about Spanish.",b:`<p>When we talk about the Spanish language, the precise term is <b>Hispanoamérica</b> (Spanish America): the countries of the Americas where Spanish is spoken, from Mexico to Argentina, plus Cuba, Puerto Rico and the Dominican Republic.</p><p><b>Latin America</b> is a broader idea. It groups the American countries that speak Romance languages: Spanish, Portuguese and French. That is why it includes Brazil and Haiti, where Spanish is not spoken. The term was coined in the 19th century in French circles. <b>Ibero-America</b> adds Brazil to Spanish America, and sometimes Spain and Portugal too.</p><blockquote>The Royal Spanish Academy recommends “Hispanoamérica” for the Spanish-speaking countries only, and “Iberoamérica” when Brazil is included.</blockquote><h2>In class</h2><p>In my textbooks I write “Spain uses vosotros; Spanish America uses ustedes”. Saying “Latin America” there would be wrong: nobody in Brazil says “ustedes”, because Brazilians speak Portuguese.</p>`}}},

{id:"museo-fader",cat:"lugares",cult:"es",src:"Gobierno de Mendoza",see:["mendoza","sinea"],
 box:{es:[["Nombre oficial","Museo Provincial de Bellas Artes Emiliano Guiñazú – Casa de Fader"],["Lugar","Mayor Drummond, Luján de Cuyo (Mendoza)"],["Casa","Construida en 1892"],["Murales","Fernando Fader, 1905–1906"],["Museo desde","1951"]],

      en:[["Official name","Emiliano Guiñazú Provincial Fine Arts Museum – Fader House"],["Location","Mayor Drummond, Luján de Cuyo (Mendoza)"],["House","Built in 1892"],["Murals","Fernando Fader, 1905–1906"],["Museum since","1951"]]},
 t:{es:{h:"Museo Fader",l:"La casona de Mendoza donde Fernando Fader pintó sus murales.",b:`<p>El <b>Museo Emiliano Guiñazú – Casa de Fader</b> está en Mayor Drummond, Luján de Cuyo, en la provincia de Mendoza (Argentina). Es una casona de fin del siglo XIX que el terrateniente Emiliano Guiñazú usaba como casa de verano, rodeada de un gran parque.</p><p>Entre 1905 y 1906 el pintor <b>Fernando Fader</b> decoró la casa con murales en el hall y en la piscina interior. Fader había nacido en Burdeos en 1882 y llegó a Mendoza de niño. Mientras pintaba, conoció a Adela Guiñazú, la hija del dueño, y se casó con ella.</p><p>En 1940 la viuda de Guiñazú donó la casa a la provincia. El museo abrió en 1951 y hoy conserva la colección más grande de obras de Fader. Estuvo cerrado desde 2012 por el deterioro del edificio y reabrió tras una larga restauración.</p><h2>Por qué lo menciono</h2><p>Comparto el apellido Fader, así que el museo es para mí un lugar especial. Además es un buen ejemplo para hablar de arte, inmigración europea y patrimonio en Hispanoamérica.</p>`},
    ru:{h:"Музей Фадера",l:"Усадьба в Мендосе, где Фернандо Фадер написал свои фрески.",b:`<p><b>Музей Эмилиано Гиньясу – Дом Фадера</b> находится в Майор-Драммонде (Лухан-де-Куйо, провинция Мендоса, Аргентина). Это усадьба конца XIX века с большим парком, которую землевладелец Эмилиано Гиньясу использовал как летний дом.</p><p>В 1905–1906 годах художник <b>Фернандо Фадер</b> расписал фресками холл и внутренний бассейн. Фадер родился в Бордо в 1882 году и ребёнком приехал в Мендосу. Работая в доме, он познакомился с дочерью хозяина, Аделой Гиньясу, и женился на ней.</p><p>В 1940 году вдова Гиньясу подарила дом провинции. Музей открылся в 1951 году и хранит самую большую коллекцию работ Фадера. С 2012 года он был закрыт из-за состояния здания и открылся снова после долгой реставрации.</p><h2>Почему я о нём говорю</h2><p>У меня та же фамилия — Фадер, поэтому этот музей для меня особенный. Кроме того, это хороший повод поговорить об искусстве, европейской иммиграции и культурном наследии Испанской Америки.</p>`},
    it:{h:"Museo Fader",l:"La villa di Mendoza dove Fernando Fader dipinse i suoi murales.",b:`<p>Il <b>Museo Emiliano Guiñazú – Casa de Fader</b> si trova a Mayor Drummond, Luján de Cuyo, nella provincia di Mendoza (Argentina). È una villa di fine Ottocento, circondata da un grande parco, che il proprietario terriero Emiliano Guiñazú usava come casa estiva.</p><p>Tra il 1905 e il 1906 il pittore <b>Fernando Fader</b> decorò l’atrio e la piscina interna con dei murales. Fader era nato a Bordeaux nel 1882 ed era arrivato a Mendoza da bambino. Mentre dipingeva conobbe Adela Guiñazú, la figlia del proprietario, e la sposò.</p><p>Nel 1940 la vedova di Guiñazú donò la casa alla provincia. Il museo aprì nel 1951 e oggi conserva la più grande collezione di opere di Fader. Chiuso dal 2012 per il degrado dell’edificio, ha riaperto dopo un lungo restauro.</p><h2>Perché lo cito</h2><p>Porto anch’io il cognome Fader, quindi per me è un luogo speciale. È anche un buon esempio per parlare di arte, emigrazione europea e patrimonio in Ispanoamerica.</p>`},
    en:{h:"Fader Museum",l:"The Mendoza mansion where Fernando Fader painted his murals.",b:`<p>The <b>Emiliano Guiñazú Museum – Fader House</b> is in Mayor Drummond, Luján de Cuyo, in the province of Mendoza, Argentina. It is a late-19th-century mansion with a large park, which the landowner Emiliano Guiñazú used as a summer house.</p><p>In 1905–1906 the painter <b>Fernando Fader</b> decorated the hall and the indoor pool with murals. Fader was born in Bordeaux in 1882 and came to Mendoza as a child. While working there he met the owner’s daughter, Adela Guiñazú, and married her.</p><p>In 1940 Guiñazú’s widow donated the house to the province. The museum opened in 1951 and holds the largest collection of Fader’s work. It was closed from 2012 because of the state of the building and reopened after a long restoration.</p><h2>Why I mention it</h2><p>I share the surname Fader, so the museum is special to me. It is also a good way into art, European immigration and heritage in Spanish America.</p>`}}},

{id:"mendoza",cat:"lugares",cult:"es",src:"Ciao, amore! A1 · Unità 2; Outsiders · Unit 10",see:["museo-fader","italiani-nel-mondo"],
 box:{es:[["País","Argentina"],["Paisaje","Cordillera de los Andes, viñedos"],["Vino","Malbec"],["En los manuales","Ciudad natal de Roberto y de Luciano"]],ru:[["Страна","Аргентина"],["Пейзаж","Анды, виноградники"],["Вино","Мальбек"],["В учебниках","Родной город Роберто и Лучано"]],it:[["Paese","Argentina"],["Paesaggio","Cordigliera delle Ande, vigneti"],["Vino","Malbec"],["Nei manuali","Città natale di Roberto e Luciano"]],en:[["Country","Argentina"],["Landscape","The Andes, vineyards"],["Wine","Malbec"],["In the textbooks","Home town of Roberto and Luciano"]]},
 t:{es:{h:"Mendoza",l:"Montañas, viñedos y sol: la ciudad que aparece en los tres manuales.",b:`<p>Mendoza está al oeste de Argentina, al pie de la cordillera de los Andes. Cerca está el Aconcagua, la montaña más alta de América. La región es famosa por sus viñedos y por el vino <b>Malbec</b>.</p><p>Es una ciudad seca y luminosa, con mucho sol, plazas, parques y acequias en las calles. En el manual de italiano Roberto la resume así: Venecia es mágica, Roma es antigua y Mendoza es luminosa.</p><p>En <i>Outsiders</i>, Luciano compara Mendoza con Londres: es más pequeña, más tranquila, más soleada y más seca, y las montañas están mucho más cerca.</p>`},
    ru:{h:"Мендоса",l:"Горы, виноградники и солнце: город, который есть во всех трёх учебниках.",b:`<p>Мендоса находится на западе Аргентины, у подножия Анд. Рядом — Аконкагуа, самая высокая гора Америки. Регион знаменит виноградниками и вином <b>мальбек</b>.</p><p>Это сухой и светлый город: много солнца, площадей, парков и оросительных канавок вдоль улиц. В учебнике итальянского Роберто говорит: Венеция волшебная, Рим древний, а Мендоса светлая.</p><p>В <i>Outsiders</i> Лучано сравнивает Мендосу с Лондоном: она меньше, тише, солнечнее и суше, а горы гораздо ближе.</p>`},
    it:{h:"Mendoza",l:"Montagne, vigneti e sole: la città che compare in tutti e tre i manuali.",b:`<p>Mendoza si trova nell’ovest dell’Argentina, ai piedi della Cordigliera delle Ande. Vicino c’è l’Aconcagua, la montagna più alta d’America. La regione è famosa per i vigneti e per il vino <b>Malbec</b>.</p><p>È una città secca e luminosa, con molto sole, piazze, parchi e canaletti d’irrigazione lungo le strade. Nel manuale d’italiano Roberto la riassume così: Venezia è magica, Roma è antica e Mendoza è luminosa.</p><p>In <i>Outsiders</i> Luciano confronta Mendoza con Londra: è più piccola, più tranquilla, più soleggiata e più secca, e le montagne sono molto più vicine.</p>`},
    en:{h:"Mendoza",l:"Mountains, vineyards and sun: the city that appears in all three textbooks.",b:`<p>Mendoza lies in western Argentina, at the foot of the Andes. Aconcagua, the highest mountain in the Americas, is nearby. The region is famous for its vineyards and its <b>Malbec</b> wine.</p><p>It is a dry, bright city with lots of sun, squares, parks and irrigation channels along the streets. In the Italian textbook Roberto sums it up: Venice is magical, Rome is ancient and Mendoza is bright.</p><p>In <i>Outsiders</i>, Luciano compares Mendoza with London: it is smaller, quieter, sunnier and drier, and the mountains are much closer.</p>`}}},

{id:"espanol-neutro",cat:"lengua",cult:"es",src:"Aquella vez 1 · Prólogo",see:["hispanoamerica","lexico"],
 box:{es:[["Qué es","Una variedad sin marcas locales fuertes"],["Para qué","Que todo estudiante se sienta cómodo"]],ru:[["Что это","Вариант без ярких местных черт"],["Зачем","Чтобы любому ученику было удобно"]],it:[["Che cos’è","Una varietà senza tratti locali forti"],["A che serve","Far sentire a suo agio ogni studente"]],en:[["What it is","A variety without strong local features"],["Purpose","Every learner can feel at home"]]},
 t:{es:{h:"Español neutro",l:"Por qué mis manuales no eligen el español de un solo país.",b:`<p>El español se habla en más de veinte países y en cada uno hay diferencias de vocabulario, pronunciación y gramática. En <i>Aquella vez</i> elegí un <b>español neutro</b>: frases que se entienden en Madrid, en Ciudad de México y en Buenos Aires.</p><p>Neutro no significa artificial. Explico las diferencias cuando aparecen (vosotros y ustedes, coche y auto, la pronunciación de la zeta), para que el estudiante sepa que existen y pueda elegir su variante preferida.</p>`},
    ru:{h:"Нейтральный испанский",l:"Почему мои учебники не выбирают испанский одной страны.",b:`<p>На испанском говорят больше чем в двадцати странах, и в каждой есть различия в лексике, произношении и грамматике. В <i>Aquella vez</i> я выбрал <b>нейтральный испанский</b>: фразы, понятные и в Мадриде, и в Мехико, и в Буэнос-Айресе.</p><p>Нейтральный не значит искусственный. Я объясняю различия, когда они встречаются (vosotros и ustedes, coche и auto, произношение Z), чтобы ученик знал о них и мог выбрать свой вариант.</p>`},
    it:{h:"Spagnolo neutro",l:"Perché i miei manuali non scelgono lo spagnolo di un solo paese.",b:`<p>Lo spagnolo si parla in più di venti paesi e ognuno ha differenze di lessico, pronuncia e grammatica. In <i>Aquella vez</i> ho scelto uno <b>spagnolo neutro</b>: frasi che si capiscono a Madrid, a Città del Messico e a Buenos Aires.</p><p>Neutro non vuol dire artificiale. Spiego le differenze quando compaiono (vosotros e ustedes, coche e auto, la pronuncia della zeta), così lo studente sa che esistono e può scegliere la sua variante.</p>`},
    en:{h:"Neutral Spanish",l:"Why my textbooks don’t pick the Spanish of a single country.",b:`<p>Spanish is spoken in more than twenty countries, each with differences in vocabulary, pronunciation and grammar. In <i>Aquella vez</i> I chose a <b>neutral Spanish</b>: sentences understood in Madrid, Mexico City and Buenos Aires alike.</p><p>Neutral does not mean artificial. I explain the differences as they come up (vosotros and ustedes, coche and auto, how to say Z) so learners know they exist and can choose their preferred variety.</p>`}}},

{id:"vosotros-ustedes",cat:"lengua",cult:"es",src:"Aquella vez 1 · Unidad 1 y 3",see:["hispanoamerica","seseo"],
 box:{es:[["España","vosotros (informal) · ustedes (formal)"],["Hispanoamérica","ustedes para todo plural"]],ru:[["Испания","vosotros (на «ты») · ustedes (вежливо)"],["Испанская Америка","ustedes для любого множественного"]],it:[["Spagna","vosotros (informale) · ustedes (formale)"],["Ispanoamerica","ustedes per ogni plurale"]],en:[["Spain","vosotros (informal) · ustedes (formal)"],["Spanish America","ustedes for every plural"]]},
 t:{es:{h:"Vosotros y ustedes",l:"La gran diferencia gramatical entre España e Hispanoamérica.",b:`<p>En España, para hablar con dos o más amigos se usa <b>vosotros</b>: «¿Vosotros sois de Madrid?». <b>Ustedes</b> queda para situaciones formales.</p><p>En Hispanoamérica, <b>ustedes</b> se usa siempre para varias personas, con amigos o con desconocidos: «¿Ustedes son de Lima?». Vosotros prácticamente no se usa.</p><h2>Usted</h2><p>Con una sola persona, <b>usted</b> es la forma de respeto: con una persona mayor, con un profesor, en una tienda o en una entrevista.</p>`},
    ru:{h:"Vosotros и ustedes",l:"Главное грамматическое различие между Испанией и Испанской Америкой.",b:`<p>В Испании к двум и более друзьям обращаются <b>vosotros</b>: «¿Vosotros sois de Madrid?». <b>Ustedes</b> используют в официальной обстановке.</p><p>В Испанской Америке для нескольких людей всегда говорят <b>ustedes</b>, и с друзьями, и с незнакомыми: «¿Ustedes son de Lima?». Vosotros там почти не употребляют.</p><h2>Usted</h2><p>К одному человеку вежливо обращаются <b>usted</b>, как русское «вы»: к пожилому человеку, к преподавателю, в магазине или на собеседовании.</p>`},
    it:{h:"Vosotros e ustedes",l:"La grande differenza grammaticale tra Spagna e Ispanoamerica.",b:`<p>In Spagna, per parlare con due o più amici si usa <b>vosotros</b>, come il nostro «voi»: «¿Vosotros sois de Madrid?». <b>Ustedes</b> resta per le situazioni formali.</p><p>In Ispanoamerica si usa sempre <b>ustedes</b> per più persone, con amici o sconosciuti: «¿Ustedes son de Lima?». Vosotros praticamente non si usa.</p><h2>Usted</h2><p>Con una sola persona, <b>usted</b> è la forma di cortesia, come il nostro «Lei»: con una persona anziana, un professore, in un negozio.</p>`},
    en:{h:"Vosotros and ustedes",l:"The big grammar difference between Spain and Spanish America.",b:`<p>In Spain, you use <b>vosotros</b> to talk to two or more friends: “¿Vosotros sois de Madrid?”. <b>Ustedes</b> is kept for formal situations.</p><p>In Spanish America, <b>ustedes</b> is always used for several people, friends or strangers: “¿Ustedes son de Lima?”. Vosotros is practically never heard.</p><h2>Usted</h2><p>With one person, <b>usted</b> is the polite form: with an older person, a teacher, in a shop or at an interview.</p>`}}},

{id:"seseo",cat:"lengua",cult:"es",src:"Aquella vez 1 · Unidad 1 (El abecedario)",see:["vosotros-ustedes","hispanoamerica"],
 box:{es:[["Zeta en España","Como TH inglesa (zapato)"],["Zeta en Hispanoamérica","Como S (sapato)"],["Afecta a","z, y c ante e, i"]],ru:[["Z в Испании","Как английское TH"],["Z в Испанской Америке","Как S"],["Касается","z, а также c перед e, i"]],it:[["Zeta in Spagna","Come la TH inglese"],["Zeta in Ispanoamerica","Come una S"],["Riguarda","z, e c davanti a e, i"]],en:[["Z in Spain","Like English TH"],["Z in Spanish America","Like S"],["Applies to","z, and c before e, i"]]},
 t:{es:{h:"La zeta y el seseo",l:"Una letra, dos pronunciaciones correctas.",b:`<p>En gran parte de España la <b>z</b> (y la <b>c</b> ante e, i) se pronuncia con la lengua entre los dientes, como la TH del inglés <i>think</i>: <i>zapato, cena, cielo</i>.</p><p>En Hispanoamérica, en Canarias y en partes de Andalucía esas letras suenan como <b>S</b>. Este fenómeno se llama <b>seseo</b>, y por eso <i>casa</i> y <i>caza</i> suenan igual.</p><p>Las dos pronunciaciones son correctas. Lo importante es elegir una y ser coherente.</p>`},
    ru:{h:"Буква Z и сесео",l:"Одна буква, два правильных произношения.",b:`<p>В большей части Испании <b>z</b> (и <b>c</b> перед e, i) произносится с языком между зубами, как английское TH в <i>think</i>: <i>zapato, cena, cielo</i>.</p><p>В Испанской Америке, на Канарах и в части Андалусии эти буквы звучат как <b>S</b>. Это явление называется <b>сесео</b> (seseo), поэтому <i>casa</i> («дом») и <i>caza</i> («охота») звучат одинаково.</p><p>Оба варианта правильные. Важно выбрать один и придерживаться его.</p>`},
    it:{h:"La zeta e il seseo",l:"Una lettera, due pronunce corrette.",b:`<p>In gran parte della Spagna la <b>z</b> (e la <b>c</b> davanti a e, i) si pronuncia con la lingua tra i denti, come la TH dell’inglese <i>think</i>: <i>zapato, cena, cielo</i>.</p><p>In Ispanoamerica, nelle Canarie e in parte dell’Andalusia queste lettere suonano come una <b>S</b>. Il fenomeno si chiama <b>seseo</b>: per questo <i>casa</i> e <i>caza</i> («caccia») suonano uguali.</p><p>Entrambe le pronunce sono corrette. L’importante è sceglierne una ed essere coerenti. Attenzione: la zeta spagnola non suona mai come la z italiana di <i>pizza</i>.</p>`},
    en:{h:"The letter Z and seseo",l:"One letter, two correct pronunciations.",b:`<p>In most of Spain, <b>z</b> (and <b>c</b> before e, i) is said with the tongue between the teeth, like the TH in <i>think</i>: <i>zapato, cena, cielo</i>.</p><p>In Spanish America, the Canary Islands and parts of Andalusia these letters sound like <b>S</b>. This is called <b>seseo</b>, which is why <i>casa</i> (house) and <i>caza</i> (hunting) sound the same.</p><p>Both are correct. What matters is choosing one and being consistent.</p>`}}},

{id:"lexico",cat:"lengua",cult:"es",src:"Aquella vez 1 · Unidad 1",see:["espanol-neutro","hispanoamerica"],
 box:{es:[["España","coche"],["México","carro"],["Argentina","auto"]],ru:[["Испания","coche"],["Мексика","carro"],["Аргентина","auto"]],it:[["Spagna","coche"],["Messico","carro"],["Argentina","auto"]],en:[["Spain","coche"],["Mexico","carro"],["Argentina","auto"]]},
 t:{es:{h:"Coche, carro, auto",l:"El español no es igual en todos los países.",b:`<p>Una misma cosa puede tener nombres distintos según el país. El ejemplo clásico es el automóvil: <b>coche</b> en España, <b>carro</b> en México y <b>auto</b> en Argentina.</p><p>Pasa lo mismo con muchas palabras de la vida diaria: <i>ordenador</i> y <i>computadora</i>, <i>móvil</i> y <i>celular</i>, <i>zumo</i> y <i>jugo</i>, <i>patata</i> y <i>papa</i>, <i>mantequilla</i> y <i>manteca</i>. En mis manuales aparecen las dos formas para que el estudiante entienda a todos.</p>`},
    ru:{h:"Coche, carro, auto",l:"Испанский звучит по-разному в разных странах.",b:`<p>Одна и та же вещь может называться по-разному в зависимости от страны. Классический пример — машина: <b>coche</b> в Испании, <b>carro</b> в Мексике и <b>auto</b> в Аргентине.</p><p>Так же с многими бытовыми словами: <i>ordenador</i> и <i>computadora</i> (компьютер), <i>móvil</i> и <i>celular</i> (мобильный), <i>zumo</i> и <i>jugo</i> (сок), <i>patata</i> и <i>papa</i> (картофель). В учебниках я даю оба варианта, чтобы ученик понимал всех.</p>`},
    it:{h:"Coche, carro, auto",l:"Lo spagnolo non è uguale in tutti i paesi.",b:`<p>La stessa cosa può avere nomi diversi a seconda del paese. L’esempio classico è l’automobile: <b>coche</b> in Spagna, <b>carro</b> in Messico e <b>auto</b> in Argentina.</p><p>Succede con molte parole quotidiane: <i>ordenador</i> e <i>computadora</i> (computer), <i>móvil</i> e <i>celular</i> (cellulare), <i>zumo</i> e <i>jugo</i> (succo), <i>patata</i> e <i>papa</i>. Nei miei manuali compaiono entrambe le forme.</p>`},
    en:{h:"Coche, carro, auto",l:"Spanish is not the same in every country.",b:`<p>The same thing can have different names depending on the country. The classic example is the car: <b>coche</b> in Spain, <b>carro</b> in Mexico and <b>auto</b> in Argentina.</p><p>The same happens with many everyday words: <i>ordenador</i> and <i>computadora</i> (computer), <i>móvil</i> and <i>celular</i> (mobile phone), <i>zumo</i> and <i>jugo</i> (juice), <i>patata</i> and <i>papa</i> (potato). My textbooks give both forms so learners understand everyone.</p>`}}},

{id:"horarios",cat:"costumbres",cult:"es",src:"Aquella vez 1 · Unidad 2 y 3",see:["mate","ciudad-hispana"],
 box:{es:[["Almuerzo en España","13:30–15:30"],["Almuerzo en Hispanoamérica","12:00–14:00"],["Cena en España","21:00–23:00"],["Cena en Hispanoamérica","19:00–21:00"],["Merienda","España, Argentina, Uruguay"]],ru:[["Обед в Испании","13:30–15:30"],["Обед в Исп. Америке","12:00–14:00"],["Ужин в Испании","21:00–23:00"],["Ужин в Исп. Америке","19:00–21:00"],["Полдник","Испания, Аргентина, Уругвай"]],it:[["Pranzo in Spagna","13:30–15:30"],["Pranzo in Ispanoamerica","12:00–14:00"],["Cena in Spagna","21:00–23:00"],["Cena in Ispanoamerica","19:00–21:00"],["Merienda","Spagna, Argentina, Uruguay"]],en:[["Lunch in Spain","13:30–15:30"],["Lunch in Spanish America","12:00–14:00"],["Dinner in Spain","21:00–23:00"],["Dinner in Spanish America","19:00–21:00"],["Merienda","Spain, Argentina, Uruguay"]]},
 t:{es:{h:"Horarios de comidas",l:"Por qué en España se cena tan tarde.",b:`<p>En el mundo hispanohablante se come a horas diferentes. En <b>España</b> se almuerza tarde, entre las 13:30 y las 15:30, y se cena muy tarde, entre las 21:00 y las 23:00. En <b>Hispanoamérica</b> se almuerza entre las 12:00 y las 14:00 y se cena antes, entre las 19:00 y las 21:00.</p><p>Una razón es el reloj: España usa el horario de Europa Central, aunque geográficamente le correspondería otro. Por eso el sol se pone tarde y en verano se cena con luz.</p><h2>La merienda</h2><p>En España, Argentina y Uruguay es común la <b>merienda</b>, entre las 17:00 y las 19:00: café, té o leche con galletas o un bocadillo. En México o Colombia no es tan habitual.</p>`},
    ru:{h:"Время приёма пищи",l:"Почему в Испании ужинают так поздно.",b:`<p>В испаноязычном мире едят в разное время. В <b>Испании</b> обедают поздно, с 13:30 до 15:30, а ужинают очень поздно, с 21:00 до 23:00. В <b>Испанской Америке</b> обедают с 12:00 до 14:00, а ужинают раньше, с 19:00 до 21:00.</p><p>Одна из причин — часы: Испания живёт по центральноевропейскому времени, хотя географически ей подходит другое. Поэтому солнце садится поздно, и летом ужинают ещё при свете.</p><h2>Полдник (merienda)</h2><p>В Испании, Аргентине и Уругвае принят <b>полдник</b> между 17:00 и 19:00: кофе, чай или молоко с печеньем или бутербродом. В Мексике и Колумбии это не так распространено.</p>`},
    it:{h:"Orari dei pasti",l:"Perché in Spagna si cena così tardi.",b:`<p>Nel mondo ispanofono si mangia a orari diversi. In <b>Spagna</b> si pranza tardi, tra le 13:30 e le 15:30, e si cena molto tardi, tra le 21:00 e le 23:00. In <b>Ispanoamerica</b> si pranza tra le 12:00 e le 14:00 e si cena prima, tra le 19:00 e le 21:00.</p><p>Una ragione è l’orologio: la Spagna usa il fuso dell’Europa centrale, anche se geograficamente gliene spetterebbe un altro. Per questo il sole tramonta tardi e d’estate si cena con la luce.</p><h2>La merienda</h2><p>In Spagna, Argentina e Uruguay è comune la <b>merienda</b>, una merenda tra le 17:00 e le 19:00: caffè, tè o latte con biscotti o un panino.</p>`},
    en:{h:"Mealtimes",l:"Why people in Spain have dinner so late.",b:`<p>Spanish speakers eat at different times. In <b>Spain</b> lunch is late, between 13:30 and 15:30, and dinner is very late, between 21:00 and 23:00. In <b>Spanish America</b> lunch is between 12:00 and 14:00 and dinner earlier, between 19:00 and 21:00.</p><p>One reason is the clock: Spain uses Central European Time, although geography would suggest another zone. So the sun sets late, and in summer people have dinner in daylight.</p><h2>Merienda</h2><p>In Spain, Argentina and Uruguay the <b>merienda</b> is common between 17:00 and 19:00: coffee, tea or milk with biscuits or a sandwich. It is less usual in Mexico or Colombia.</p>`}}},

{id:"ciudad-hispana",cat:"lugares",cult:"es",src:"Aquella vez 1 · Unidad 4",see:["horarios","sinea"],
 box:{es:[["Centro","Plaza central"],["Cerca","Iglesia, casa de gobierno, cabildo"],["Unidad de medida","La cuadra"],["Plano","Calles rectas, en damero"]],ru:[["Центр","Главная площадь"],["Рядом","Церковь, здание правительства"],["Мера расстояния","Квартал (cuadra)"],["План","Прямые улицы, шахматная сетка"]],it:[["Centro","Piazza centrale"],["Vicino","Chiesa, palazzo del governo"],["Unità di misura","La cuadra (isolato)"],["Pianta","Strade dritte, a scacchiera"]],en:[["Centre","Main square"],["Nearby","Church, government house"],["Unit of distance","The cuadra (block)"],["Plan","Straight streets in a grid"]]},
 t:{es:{h:"La ciudad de estilo español",l:"Plaza central, cuadras y plazas aledañas.",b:`<p>Muchas ciudades de Hispanoamérica siguen un modelo que trajeron los españoles. Primero se elegía el lugar de la <b>plaza central</b>, el corazón de la ciudad. Alrededor se ponían la iglesia, la casa de gobierno y el mercado, y después se trazaban calles rectas y ordenadas.</p><p>Las calles forman <b>cuadras</b>: el tramo de calle entre dos esquinas. Por eso en Hispanoamérica se dan direcciones así: «el mercado está a dos cuadras de la plaza». Las plazas pequeñas cercanas se llaman <b>plazas aledañas</b>.</p>`},
    ru:{h:"Город испанского типа",l:"Главная площадь, кварталы и соседние площади.",b:`<p>Многие города Испанской Америки построены по модели, привезённой испанцами. Сначала выбирали место для <b>главной площади</b> — сердца города. Вокруг ставили церковь, здание правительства и рынок, а потом прокладывали прямые улицы.</p><p>Улицы образуют <b>cuadras</b> — отрезки улицы между двумя перекрёстками. Поэтому дорогу объясняют так: «рынок в двух кварталах от площади». Небольшие площади поблизости называют <b>plazas aledañas</b>.</p>`},
    it:{h:"La città di stile spagnolo",l:"Piazza centrale, cuadras e piazze vicine.",b:`<p>Molte città dell’Ispanoamerica seguono un modello portato dagli spagnoli. Prima si sceglieva il luogo della <b>piazza centrale</b>, il cuore della città. Intorno si mettevano la chiesa, il palazzo del governo e il mercato, poi si tracciavano strade dritte e ordinate.</p><p>Le strade formano <b>cuadras</b>: il tratto di strada tra due incroci. Per questo si danno indicazioni così: «il mercato è a due cuadras dalla piazza». Le piazzette vicine si chiamano <b>plazas aledañas</b>.</p>`},
    en:{h:"The Spanish-style city",l:"Main square, blocks and neighbouring squares.",b:`<p>Many cities in Spanish America follow a model brought by the Spanish. First they chose the site of the <b>main square</b>, the heart of the city. The church, the government house and the market went around it, then straight, orderly streets were laid out.</p><p>The streets form <b>cuadras</b>: the stretch of street between two corners. So directions sound like this: “the market is two cuadras from the square”. Small squares nearby are called <b>plazas aledañas</b>.</p>`}}},

{id:"mate",cat:"costumbres",cult:"es",src:"Aquella vez 1 · Unidad 1 y 5",see:["horarios","mendoza"],
 box:{es:[["Qué es","Infusión de yerba mate"],["Dónde","Argentina, Uruguay, Paraguay, sur de Brasil"],["Se toma con","Mate (recipiente) y bombilla"]],ru:[["Что это","Настой из листьев йерба-мате"],["Где","Аргентина, Уругвай, Парагвай, юг Бразилии"],["Пьют из","Калебасы через бомбилью"]],it:[["Che cos’è","Infuso di yerba mate"],["Dove","Argentina, Uruguay, Paraguay, sud del Brasile"],["Si beve con","Mate (recipiente) e bombilla"]],en:[["What it is","An infusion of yerba mate"],["Where","Argentina, Uruguay, Paraguay, southern Brazil"],["Drunk with","A gourd and a bombilla straw"]]},
 t:{es:{h:"El mate",l:"Una bebida que se comparte.",b:`<p>El <b>mate</b> es una infusión de hojas de yerba mate que se toma en un recipiente, también llamado mate, con una bombilla metálica. Es muy popular en Argentina, Uruguay y Paraguay.</p><p>Lo importante es que <b>se comparte</b>: una persona, el cebador, prepara el mate y lo pasa a cada uno del grupo, que lo toma y lo devuelve. Tomar mate con alguien es una forma de conversar, de pasar tiempo juntos y de dar la bienvenida.</p>`},
    ru:{h:"Мате",l:"Напиток, которым делятся.",b:`<p><b>Мате</b> — настой из листьев йерба-мате. Его пьют из сосуда, который тоже называется мате, через металлическую трубочку бомбилью. Он очень популярен в Аргентине, Уругвае и Парагвае.</p><p>Главное, что мате <b>пьют вместе</b>: один человек готовит его и по очереди передаёт каждому, тот выпивает и возвращает. Пить мате с кем-то — значит разговаривать, проводить время вместе и принимать гостя.</p>`},
    it:{h:"Il mate",l:"Una bevanda che si condivide.",b:`<p>Il <b>mate</b> è un infuso di foglie di yerba mate che si beve in un recipiente, anch’esso chiamato mate, con una cannuccia metallica, la bombilla. È molto diffuso in Argentina, Uruguay e Paraguay.</p><p>L’essenziale è che <b>si condivide</b>: una persona prepara il mate e lo passa a ciascuno del gruppo, che lo beve e lo restituisce. Bere un mate con qualcuno vuol dire chiacchierare, stare insieme e accogliere.</p>`},
    en:{h:"Mate",l:"A drink you share.",b:`<p><b>Mate</b> is an infusion of yerba mate leaves, drunk from a gourd (also called a mate) through a metal straw, the bombilla. It is very popular in Argentina, Uruguay and Paraguay.</p><p>The key thing is that <b>it is shared</b>: one person prepares the mate and passes it to each person in the group, who drinks and hands it back. Sharing mate means talking, spending time together and welcoming someone.</p>`}}},

{id:"italiani-nel-mondo",cat:"historia",cult:"it",src:"Ciao, amore! A1 · Unità 2",see:["mendoza","stereotipi"],
 box:{es:[["Destinos principales","Argentina, Brasil, Estados Unidos"],["Qué buscaban","Trabajo, pan, futuro"],["Huella","Apellidos, recetas, palabras"]],ru:[["Основные страны","Аргентина, Бразилия, США"],["Что искали","Работу, хлеб, будущее"],["След","Фамилии, рецепты, слова"]],it:[["Mete principali","Argentina, Brasile, Stati Uniti"],["Cosa cercavano","Lavoro, pane, futuro"],["Traccia","Cognomi, ricette, parole"]],en:[["Main destinations","Argentina, Brazil, United States"],["What they sought","Work, bread, a future"],["Legacy","Surnames, recipes, words"]]},
 t:{es:{h:"Italianos en el mundo",l:"La emigración italiana a Argentina, Brasil y Estados Unidos.",b:`<p>Entre fines del siglo XIX y mediados del XX, millones de italianos dejaron su país en busca de trabajo y de una vida nueva. Tres destinos fueron especialmente importantes: <b>Argentina</b>, <b>Brasil</b> y <b>Estados Unidos</b>.</p><p>En Argentina, y sobre todo en Buenos Aires, la huella es enorme: apellidos, ñoquis del 29, palabras del lunfardo y una forma de hablar con mucha entonación italiana. En Brasil el italiano se mezcló con el portugués, sobre todo en el sur y el sudeste. En Estados Unidos nacieron comunidades italoamericanas en Nueva York, Chicago, Boston o Filadelfia.</p><p>La cultura italiana en el mundo no es una copia de Italia: es una cultura viva, mezclada con otras lenguas.</p>`},
    ru:{h:"Итальянцы в мире",l:"Итальянская эмиграция в Аргентину, Бразилию и США.",b:`<p>С конца XIX до середины XX века миллионы итальянцев уехали из страны в поисках работы и новой жизни. Три направления были особенно важны: <b>Аргентина</b>, <b>Бразилия</b> и <b>США</b>.</p><p>В Аргентине, особенно в Буэнос-Айресе, итальянский след огромен: фамилии, ньокки 29-го числа, слова жаргона лунфардо и интонация, очень похожая на итальянскую. В Бразилии итальянский смешался с португальским, прежде всего на юге и юго-востоке. В США появились итало-американские общины в Нью-Йорке, Чикаго, Бостоне и Филадельфии.</p><p>Итальянская культура в мире — не копия Италии, а живая культура, смешанная с другими языками.</p>`},
    it:{h:"Italiani nel mondo",l:"L’emigrazione italiana in Argentina, Brasile e Stati Uniti.",b:`<p>Tra la fine dell’Ottocento e la metà del Novecento milioni di italiani lasciarono il loro paese in cerca di lavoro, pane e futuro. Tre mete furono molto importanti: l’<b>Argentina</b>, il <b>Brasile</b> e gli <b>Stati Uniti</b>.</p><p>In Argentina, soprattutto a Buenos Aires, la traccia è enorme: cognomi, gli gnocchi del 29, parole del lunfardo e un’intonazione molto italiana. In Brasile l’italiano incontrò il portoghese, soprattutto nel sud e nel sud-est. Negli Stati Uniti nacquero comunità italoamericane a New York, Chicago, Boston e Filadelfia.</p><p>La cultura italiana nel mondo non è una copia dell’Italia: è una cultura viva, mescolata con altre lingue.</p>`},
    en:{h:"Italians around the world",l:"Italian emigration to Argentina, Brazil and the United States.",b:`<p>Between the late 19th and mid-20th centuries, millions of Italians left their country looking for work and a new life. Three destinations mattered most: <b>Argentina</b>, <b>Brazil</b> and the <b>United States</b>.</p><p>In Argentina, especially Buenos Aires, the mark is huge: surnames, gnocchi on the 29th of each month, words of Lunfardo slang and an intonation that sounds very Italian. In Brazil Italian mixed with Portuguese, above all in the south and south-east. In the US, Italian-American communities grew in New York, Chicago, Boston and Philadelphia.</p><p>Italian culture abroad is not a copy of Italy: it is a living culture mixed with other languages.</p>`}}},

{id:"uscire",cat:"costumbres",cult:"it",src:"Ciao, amore! A1 · Unità 3, 7 e 8",see:["venezia","stereotipi"],
 box:{es:[["Lugares","El bar, la plaza, el centro"],["Expresión","fare due passi"],["Mañana","Un espresso en el bar"],["Domingo","Almuerzo en familia"]],ru:[["Места","Бар, площадь, центр"],["Выражение","fare due passi"],["Утро","Эспрессо в баре"],["Воскресенье","Семейный обед"]],it:[["Luoghi","Il bar, la piazza, il centro"],["Espressione","fare due passi"],["Mattina","Un espresso al bar"],["Domenica","Pranzo in famiglia"]],en:[["Places","The bar, the piazza, the centre"],["Expression","fare due passi"],["Morning","An espresso at the bar"],["Sunday","Family lunch"]]},
 t:{es:{h:"Uscire: salir a la italiana",l:"El bar, la plaza y «fare due passi».",b:`<p>Para muchos italianos <b>uscire</b> (salir) no es solo ir fuera de casa: es un estilo de vida. Se sale para tomar un café, pasear, encontrarse con amigos o comer algo juntos.</p><p>El <b>bar</b> italiano no es un lugar de copas: es donde se toma el espresso de pie por la mañana, se desayuna un cappuccino con un cornetto y se lee el periódico. La <b>piazza</b> es la sala de estar de la ciudad.</p><p>Pasear se dice <b>fare due passi</b>, literalmente «dar dos pasos». El domingo, muchas familias almuerzan juntas.</p>`},
    ru:{h:"Uscire: выходить по-итальянски",l:"Бар, площадь и «fare due passi».",b:`<p>Для многих итальянцев <b>uscire</b> (выходить) — это не просто выйти из дома, а образ жизни. Выходят, чтобы выпить кофе, прогуляться, встретиться с друзьями или вместе поесть.</p><p>Итальянский <b>бар</b> — не место для выпивки. Там утром стоя пьют эспрессо, завтракают капучино с корнетто и читают газету. <b>Пьяцца</b> — гостиная города.</p><p>Прогуляться по-итальянски — <b>fare due passi</b>, буквально «сделать два шага». По воскресеньям многие семьи обедают вместе.</p>`},
    it:{h:"Uscire",l:"Il bar, la piazza e «fare due passi».",b:`<p>Per molti italiani <b>uscire</b> non è solo andare fuori casa: è uno stile di vita. Si esce per prendere un caffè, fare una passeggiata, incontrare gli amici o mangiare qualcosa insieme.</p><p>Il <b>bar</b> è il posto dell’espresso al banco la mattina, del cappuccino con il cornetto e del giornale. La <b>piazza</b> è il salotto della città: bar, tavolini, negozi e persone che parlano senza fretta.</p><p>Passeggiare si dice anche <b>fare due passi</b>. La domenica molte famiglie pranzano insieme. Uscire è una piccola festa della vita.</p>`},
    en:{h:"Uscire: going out Italian-style",l:"The bar, the piazza and “fare due passi”.",b:`<p>For many Italians <b>uscire</b> (going out) is not just leaving the house: it is a way of life. People go out for a coffee, a stroll, to meet friends or to eat something together.</p><p>The Italian <b>bar</b> is not a pub. It is where you drink an espresso standing at the counter in the morning, have a cappuccino and a cornetto, and read the paper. The <b>piazza</b> is the city’s living room.</p><p>Going for a short walk is <b>fare due passi</b>, literally “taking two steps”. On Sundays many families have lunch together.</p>`}}},

{id:"venezia",cat:"lugares",cult:"it",src:"Ciao, amore! A1 · Unità 1–6 e 9",see:["uscire","sinea"],
 box:{es:[["Región","Véneto, noreste de Italia"],["Símbolos","Canales, góndolas, máscaras, puentes"],["Fiesta","El Carnaval"],["Desafíos","Turismo masivo, acqua alta"]],ru:[["Регион","Венето, северо-восток Италии"],["Символы","Каналы, гондолы, маски, мосты"],["Праздник","Карнавал"],["Проблемы","Массовый туризм, acqua alta"]],it:[["Regione","Veneto, nord-est d’Italia"],["Simboli","Canali, gondole, maschere, ponti"],["Festa","Il Carnevale"],["Sfide","Turismo di massa, acqua alta"]],en:[["Region","Veneto, north-east Italy"],["Symbols","Canals, gondolas, masks, bridges"],["Festival","Carnival"],["Challenges","Mass tourism, acqua alta"]]},
 t:{es:{h:"Venecia",l:"La ciudad del agua y de las máscaras, escenario de «Ciao, amore!».",b:`<p>Venecia es una ciudad única: en lugar de grandes calles tiene <b>canales</b>, y casi no hay coches porque la ciudad vive sobre el agua. Se camina por calles estrechas y se cruzan puentes; la plaza principal es <b>Piazza San Marco</b>.</p><p>La <b>máscara veneciana</b> es símbolo del Carnaval, pero en mi manual es más: Natalia, la veneciana, lleva su máscara clásica como parte de su historia.</p><p>Venecia también enfrenta problemas modernos: debe protegerse del turismo masivo y del <b>acqua alta</b>, las mareas altas que inundan la ciudad.</p>`},
    ru:{h:"Венеция",l:"Город воды и масок, где происходит действие «Ciao, amore!».",b:`<p>Венеция уникальна: вместо широких улиц здесь <b>каналы</b>, и машин почти нет, потому что город живёт на воде. Ходят по узким улочкам и мостам; главная площадь — <b>Пьяцца Сан-Марко</b>.</p><p><b>Венецианская маска</b> — символ карнавала, но в моём учебнике это больше: Наталья, венецианка, носит свою классическую маску как часть своей истории.</p><p>У Венеции есть и современные проблемы: город должен защищаться от массового туризма и от <b>acqua alta</b> — высокой воды, которая затапливает улицы.</p>`},
    it:{h:"Venezia",l:"La città dell’acqua e delle maschere, scenario di «Ciao, amore!».",b:`<p>Venezia è una città unica al mondo: invece di grandi strade ci sono i <b>canali</b>, e non ci sono macchine perché la città vive sull’acqua. Si cammina per calli strette e si attraversano ponti; la piazza principale è <b>Piazza San Marco</b>.</p><p>La <b>maschera veneziana</b> è il simbolo del Carnevale, ma nel mio manuale è di più: Natalia, la veneziana, porta la sua maschera classica come parte della sua storia.</p><p>Venezia deve anche proteggersi dal turismo di massa e dall’<b>acqua alta</b>, le maree che allagano la città.</p>`},
    en:{h:"Venice",l:"The city of water and masks, setting of “Ciao, amore!”.",b:`<p>Venice is unique: instead of big streets it has <b>canals</b>, and there are almost no cars because the city lives on the water. You walk along narrow alleys and over bridges; the main square is <b>Piazza San Marco</b>.</p><p>The <b>Venetian mask</b> is the symbol of Carnival, but in my textbook it means more: Natalia, the Venetian, wears her classic mask as part of her story.</p><p>Venice also faces modern problems: it must protect itself from mass tourism and from <b>acqua alta</b>, the high tides that flood the city.</p>`}}},

{id:"stereotipi",cat:"costumbres",cult:"it",src:"Ciao, amore! A1 · Unità 2",see:["italiani-nel-mondo","uscire"],
 box:{es:[["Qué es","Una idea simple sobre un pueblo"],["Ejemplos","Italianos y gestos, argentinos y tango"],["Actitud","Curiosidad, con cuidado"]],ru:[["Что это","Упрощённое представление о народе"],["Примеры","Итальянцы и жесты, аргентинцы и танго"],["Подход","Интерес, но осторожно"]],it:[["Che cos’è","Un’idea semplice su un popolo"],["Esempi","Italiani e gesti, argentini e tango"],["Atteggiamento","Curiosità, con attenzione"]],en:[["What it is","A simple idea about a people"],["Examples","Italians and gestures, Argentines and tango"],["Attitude","Curious, but careful"]]},
 t:{es:{h:"Estereotipos",l:"Simpáticos a veces, pero no siempre verdaderos.",b:`<p>Un estereotipo es una idea simple sobre un pueblo o una cultura. Se dice que todos los italianos hablan con las manos y aman la pasta, que todos los argentinos bailan tango, que los brasileños siempre están alegres o que los alemanes son muy puntuales.</p><p>Muchos tienen algo de verdad: en Italia se usan mucho los gestos y el tango es muy importante en Buenos Aires. Pero un país es grande y las personas no son todas iguales. En clase uso los estereotipos como punto de partida para conversar, nunca como conclusión.</p>`},
    ru:{h:"Стереотипы",l:"Иногда забавные, но не всегда правдивые.",b:`<p>Стереотип — упрощённое представление о народе или культуре. Говорят, что все итальянцы говорят руками и любят пасту, все аргентинцы танцуют танго, бразильцы всегда весёлые, а немцы очень пунктуальны.</p><p>Во многих есть доля правды: в Италии действительно много жестикулируют, а танго очень важно для Буэнос-Айреса. Но страна большая, и люди не одинаковые. На уроке я использую стереотипы как повод для разговора, а не как вывод.</p>`},
    it:{h:"Stereotipi",l:"A volte divertenti, ma non sempre veri.",b:`<p>Uno stereotipo è un’idea semplice su un popolo o su una cultura. Molti pensano che tutti gli italiani parlino con le mani e amino la pasta, che tutti gli argentini ballino il tango, che i brasiliani siano sempre allegri e i tedeschi molto puntuali.</p><p>Spesso c’è un fondo di verità: in Italia molte persone usano i gesti, e il tango è importante a Buenos Aires. Ma un paese è grande e le persone non sono tutte uguali. In classe uso gli stereotipi per cominciare una conversazione, mai per chiuderla.</p>`},
    en:{h:"Stereotypes",l:"Sometimes funny, but not always true.",b:`<p>A stereotype is a simple idea about a people or a culture. People say all Italians talk with their hands and love pasta, all Argentines dance tango, Brazilians are always cheerful and Germans are very punctual.</p><p>Many contain some truth: Italians do use a lot of gestures, and tango matters a great deal in Buenos Aires. But a country is big and people are not all the same. In class I use stereotypes to start a conversation, never to end it.</p>`}}},

 box:{es:[["Revolución Industrial","Siglos XVIII–XIX"],["Factores","Industria, comercio, finanzas, imperio"],["Hoy","Servicios, banca, universidades"]],ru:[["Промышленная революция","XVIII–XIX века"],["Факторы","Промышленность, торговля, финансы, империя"],["Сегодня","Услуги, банки, университеты"]],it:[["Rivoluzione industriale","Secoli XVIII–XIX"],["Fattori","Industria, commercio, finanza, impero"],["Oggi","Servizi, banche, università"]],en:[["Industrial Revolution","18th–19th centuries"],["Factors","Industry, trade, finance, empire"],["Today","Services, banking, universities"]]},
 t:{es:{h:"¿Por qué Inglaterra es tan rica?",l:"Industria, comercio e imperio, mirados desde fuera.",b:`<p>Mi manual de inglés se llama <i>Outsiders</i> porque no pretende elogiar la cultura inglesa en bloque, sino entender el mundo anglófono con curiosidad y con mirada propia.</p><p>La riqueza de Inglaterra tiene varias causas. La <b>Revolución Industrial</b> de los siglos XVIII y XIX trajo fábricas, máquinas y ferrocarriles. El <b>comercio</b> marítimo convirtió a Londres en un gran centro financiero. El <b>Imperio británico</b> aportó recursos y mercados, y esa historia también incluye conquista y explotación.</p><p>Hoy la economía depende sobre todo de los servicios: banca, tecnología, educación, turismo y cultura.</p>`},
    ru:{h:"Почему Англия так богата?",l:"Промышленность, торговля и империя — взгляд со стороны.",b:`<p>Мой учебник английского называется <i>Outsiders</i> («Посторонние»): его цель не восхвалять английскую культуру целиком, а понять англоязычный мир с интересом и собственным взглядом.</p><p>У богатства Англии несколько причин. <b>Промышленная революция</b> XVIII–XIX веков принесла фабрики, машины и железные дороги. Морская <b>торговля</b> сделала Лондон крупным финансовым центром. <b>Британская империя</b> дала ресурсы и рынки, и эта история включает также завоевания и эксплуатацию.</p><p>Сегодня экономика держится прежде всего на услугах: банках, технологиях, образовании, туризме и культуре.</p>`},
    it:{h:"Perché l’Inghilterra è così ricca?",l:"Industria, commercio e impero, visti da fuori.",b:`<p>Il mio manuale d’inglese si chiama <i>Outsiders</i> perché non vuole lodare in blocco la cultura inglese, ma capire il mondo anglofono con curiosità e con uno sguardo proprio.</p><p>La ricchezza dell’Inghilterra ha diverse cause. La <b>Rivoluzione industriale</b> dei secoli XVIII e XIX portò fabbriche, macchine e ferrovie. Il <b>commercio</b> marittimo fece di Londra un grande centro finanziario. L’<b>Impero britannico</b> fornì risorse e mercati, e questa storia comprende anche conquista e sfruttamento.</p><p>Oggi l’economia dipende soprattutto dai servizi: banche, tecnologia, istruzione, turismo e cultura.</p>`},
    en:{h:"Why is England so rich?",l:"Industry, trade and empire, seen from outside.",b:`<p>My English textbook is called <i>Outsiders</i> because it does not set out to praise English culture as a whole. It tries to understand the English-speaking world with curiosity and a perspective of one’s own.</p><p>England’s wealth has several causes. The <b>Industrial Revolution</b> of the 18th and 19th centuries brought factories, machines and railways. Sea <b>trade</b> made London a major financial centre. The <b>British Empire</b> supplied resources and markets, and that history also includes conquest and exploitation.</p><p>Today the economy rests mainly on services: banking, technology, education, tourism and culture.</p>`}}},

{id:"londres",cat:"historia",cult:"en",src:"Outsiders · Unit 7–8",see:["inglaterra-riqueza"],
 box:{es:[["Primer metro","1863"],["Iluminación del XIX","Farolas de gas"],["Ciudades vecinas","Oxford, York, Brighton, Liverpool"]],ru:[["Первое метро","1863"],["Освещение в XIX веке","Газовые фонари"],["Другие города","Оксфорд, Йорк, Брайтон, Ливерпуль"]],it:[["Prima metropolitana","1863"],["Illuminazione nell’Ottocento","Lampioni a gas"],["Altre città","Oxford, York, Brighton, Liverpool"]],en:[["First underground","1863"],["19th-century lighting","Gas lamps"],["Other cities","Oxford, York, Brighton, Liverpool"]]},
 t:{es:{h:"Londres antes y ahora",l:"De los coches de caballos al metro más antiguo del mundo.",b:`<p>En el siglo XIX la gente se movía por Londres en caballo, carruaje u ómnibus. En <b>1863</b> se inauguró el primer ferrocarril subterráneo del mundo, que cambió la forma de desplazarse por la ciudad.</p><p>Las calles eran ruidosas, había mercados callejeros, muelles y fábricas, y de noche las farolas de gas iluminaban la ciudad. Sin televisión ni internet, la gente leía periódicos, libros y cartas.</p><p>Hoy Londres es una ciudad moderna e internacional, pero conserva calles, mercados y estaciones de aquella época.</p>`},
    ru:{h:"Лондон тогда и сейчас",l:"От конных экипажей до старейшего метро в мире.",b:`<p>В XIX веке по Лондону ездили верхом, в каретах и омнибусах. В <b>1863</b> году открылась первая в мире подземная железная дорога, и это изменило передвижение по городу.</p><p>Улицы были шумными, повсюду были уличные рынки, доки и фабрики, а ночью город освещали газовые фонари. Без телевизора и интернета люди читали газеты, книги и письма.</p><p>Сегодня Лондон — современный международный город, но в нём сохранились улицы, рынки и вокзалы той эпохи.</p>`},
    it:{h:"Londra ieri e oggi",l:"Dalle carrozze alla metropolitana più antica del mondo.",b:`<p>Nell’Ottocento a Londra ci si spostava a cavallo, in carrozza o in omnibus. Nel <b>1863</b> fu inaugurata la prima ferrovia sotterranea del mondo, che cambiò il modo di muoversi in città.</p><p>Le strade erano rumorose, c’erano mercati, moli e fabbriche, e di notte la città era illuminata da lampioni a gas. Senza televisione né internet, si leggevano giornali, libri e lettere.</p><p>Oggi Londra è una città moderna e internazionale, ma conserva strade, mercati e stazioni di quell’epoca.</p>`},
    en:{h:"London then and now",l:"From horse-drawn carriages to the world’s oldest underground.",b:`<p>In the 19th century people moved around London by horse, carriage and omnibus. In <b>1863</b> the world’s first underground railway opened and changed how people travelled through the city.</p><p>The streets were busy and noisy, full of markets, docks and factories, and at night gas lamps lit the city. Without television or the Internet, people read newspapers, books and letters.</p><p>Today London is a modern, international city, but you can still see streets, markets and stations from that time.</p>`}}},

{id:"sinea",cat:"universo",cult:"es",src:"Aquella vez 1 · Unidad 4; Ciao, amore! A1 · Unità 7",see:["ciudad-hispana","venezia","museo-fader"],
 box:{es:[["Tipo","Ciudad imaginaria"],["Barrios","De los locos, de los ricos tristes, de los pobres felices"],["Personajes","Natalia, Roberto, Marcos, Alicia, Luis, Lucy"]],ru:[["Тип","Вымышленный город"],["Районы","Сумасшедших, грустных богачей, счастливых бедняков"],["Персонажи","Наталья, Роберто, Маркос, Алисия, Луис, Люси"]],it:[["Tipo","Città immaginaria"],["Quartieri","Dei pazzi, dei ricchi tristi, dei poveri felici"],["Personaggi","Natalia, Roberto, Marco, Alice, Luis, Lucy"]],en:[["Type","Imaginary city"],["Districts","The mad, the sad rich, the happy poor"],["Characters","Natalia, Roberto, Marcos, Alicia, Luis, Lucy"]]},
 t:{es:{h:"Sinea y los personajes",l:"La ciudad imaginaria de mis novelas que recorre los manuales.",b:`<p>Soy escritor, y en mis manuales aparecen personajes y lugares de mis novelas. Una lengua no vive solo en las reglas, sino también en las personas, las emociones y las historias.</p><p><b>Sinea</b> es una ciudad tranquila pero misteriosa. Tiene una estación central, una plaza con un monumento, metro con estaciones como «Natalia mi amor» y barrios muy distintos: el <b>barrio de los locos</b>, lleno de colores y música; el de los <b>ricos tristes</b> y el de los <b>pobres felices</b>.</p><h2>Personajes que vuelven</h2><ul><li><b>Natalia</b>, la veneciana misteriosa de doscientos años.</li><li><b>Roberto</b>, arqueólogo argentino que vive en Venecia.</li><li><b>Marcos</b>, detective serio, y <b>Alicia</b>, astróloga.</li><li><b>Luis</b>, <b>Lucy</b> y <b>Luciano</b>, que viajan hasta Londres en <i>Outsiders</i>.</li></ul>`},
    ru:{h:"Синея и персонажи",l:"Вымышленный город из моих романов, который проходит через все учебники.",b:`<p>Я писатель, и в моих учебниках живут персонажи и места из моих романов. Язык существует не только в правилах, но и в людях, эмоциях и историях.</p><p><b>Синея</b> — спокойный, но загадочный город. Там есть центральный вокзал, площадь с памятником, метро со станциями вроде «Natalia mi amor» и очень разные районы: <b>район сумасшедших</b>, полный красок и музыки, район <b>грустных богачей</b> и район <b>счастливых бедняков</b>.</p><h2>Сквозные персонажи</h2><ul><li><b>Наталья</b> — таинственная венецианка, которой двести лет.</li><li><b>Роберто</b> — аргентинский археолог, живущий в Венеции.</li><li><b>Маркос</b> — серьёзный детектив, и <b>Алисия</b> — астролог.</li><li><b>Луис</b>, <b>Люси</b> и <b>Лучано</b>, которые в <i>Outsiders</i> оказываются в Лондоне.</li></ul>`},
    it:{h:"Sinea e i personaggi",l:"La città immaginaria dei miei romanzi che attraversa i manuali.",b:`<p>Sono scrittore, e nei miei manuali compaiono personaggi e luoghi dei miei romanzi. Una lingua non vive solo nelle regole, ma anche nelle persone, nelle emozioni e nelle storie.</p><p><b>Sinea</b> è una città calma fuori, ma piena di misteri dentro. Ha una stazione centrale, una piazza con un monumento, una metropolitana con fermate come «Natalia mi amor» e quartieri diversissimi: il <b>quartiere dei pazzi</b>, pieno di colori e musica, quello dei <b>ricchi tristi</b> e quello dei <b>poveri felici</b>.</p><h2>Personaggi che ritornano</h2><ul><li><b>Natalia</b>, la veneziana misteriosa di duecento anni.</li><li><b>Roberto</b>, archeologo argentino che vive a Venezia.</li><li><b>Marco</b>, detective serio, e <b>Alice</b>, astrologa.</li><li><b>Luis</b>, <b>Lucy</b> e <b>Luciano</b>, che in <i>Outsiders</i> arrivano a Londra.</li></ul>`},
    en:{h:"Sinea and the characters",l:"The imaginary city from my novels that runs through the textbooks.",b:`<p>I am a writer, and characters and places from my novels appear in my textbooks. A language lives not only in rules but in people, emotions and stories.</p><p><b>Sinea</b> is a quiet but mysterious city. It has a central station, a square with a monument, an underground with stations like “Natalia mi amor” and very different districts: the <b>district of the mad</b>, full of colour and music, the district of the <b>sad rich</b> and that of the <b>happy poor</b>.</p><h2>Recurring characters</h2><ul><li><b>Natalia</b>, the mysterious two-hundred-year-old Venetian.</li><li><b>Roberto</b>, an Argentine archaeologist living in Venice.</li><li><b>Marcos</b>, a serious detective, and <b>Alicia</b>, an astrologer.</li><li><b>Luis</b>, <b>Lucy</b> and <b>Luciano</b>, who end up in London in <i>Outsiders</i>.</li></ul>`}}}
];

let lang="es",cat=null,cult=null,q="",cur=null;
try{const s=localStorage.getItem("ef-lang");if(s&&UI[s])lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const strip=h=>h.replace(/<[^>]+>/g," ");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function filtered(){
  const nq=norm(q.trim());
  return A.filter(a=>(!cat||a.cat===cat)&&(!cult||a.cult===cult)&&(!nq||norm(a.t[lang].h+" "+a.t[lang].l+" "+strip(a.t[lang].b)).includes(nq)));
}
function chips(el,obj,state,set){
  el.innerHTML="";
  const mk=(k,label)=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=label;b.setAttribute("aria-pressed",String(state===k));b.onclick=()=>{set(state===k?null:k);render();};el.appendChild(b);};
  mk(null,UI[lang].all);Object.entries(obj).forEach(([k,v])=>mk(k,v));
}
function renderList(){
  const L=$("list");L.innerHTML="";const f=filtered();
  if(!f.length){L.innerHTML=`<li class="empty">${UI[lang].none}</li>`;return;}
  f.sort((x,y)=>x.t[lang].h.localeCompare(y.t[lang].h,lang)).forEach(a=>{
    const li=document.createElement("li");const b=document.createElement("button");b.type="button";b.className="entry";
    b.innerHTML=`<span>${a.t[lang].h}</span><small>${UI[lang].cults[a.cult]}</small>`;
    b.setAttribute("aria-current",String(cur===a.id));b.onclick=()=>open(a.id,true);li.appendChild(b);L.appendChild(li);});
}
function renderArticle(){
  const U=UI[lang],el=$("art");
  if(!cur){
    const picks=["hispanoamerica","museo-fader","uscire","inglaterra-riqueza"].map(id=>A.find(a=>a.id===id));
    el.innerHTML=`<div class="crumb"><span>${U.home}</span><span class="tag">${A.length} · ${U.list.toLowerCase()}</span></div><h1>${U.home}</h1><p class="lede">${U.intro}</p><div class="body"><h2>${U.start}</h2><ul>${picks.map(a=>`<li><a href="#${a.id}" data-go="${a.id}">${a.t[lang].h}</a>. ${a.t[lang].l}</li>`).join("")}</ul>${Object.entries(U.cats).map(([k,v])=>{const xs=A.filter(a=>a.cat===k);return `<h2>${v}</h2><p>${xs.map(a=>`<a href="#${a.id}" data-go="${a.id}">${a.t[lang].h}</a>`).join(" · ")}</p>`}).join("")}</div>`;
  }else{
    const a=A.find(x=>x.id===cur),T=a.t[lang];
    el.innerHTML=`<div class="crumb"><span>${U.cats[a.cat]}</span><span class="tag">${U.cults[a.cult]}</span></div><h1>${T.h}</h1><p class="lede">${T.l}</p><div class="body"><aside class="infobox"><h3>${T.h}</h3><dl>${a.box[lang].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></aside>${T.b}</div><p class="src">${U.src}: ${a.src}</p><nav class="see"><b>${U.see}:</b>${a.see.map(id=>{const s=A.find(x=>x.id===id);return s?`<a href="#${id}" data-go="${id}">${s.t[lang].h}</a>`:""}).join("")}</nav>`;
  }
  el.querySelectorAll("[data-go]").forEach(x=>x.onclick=e=>{e.preventDefault();open(x.dataset.go,true);});
}
function render(){
  const U=UI[lang];document.documentElement.lang=lang;
  $("siteSub").textContent=U.sub;$("q").placeholder=U.search;$("q").setAttribute("aria-label",U.search);
  $("lblCat").textContent=U.cat;$("lblCult").textContent=U.cult;$("lblList").textContent=U.list;$("foot").textContent=U.foot;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  chips($("cats"),U.cats,cat,v=>cat=v);chips($("cults"),U.cults,cult,v=>cult=v);
  renderList();renderArticle();
}
function open(id,scroll){cur=A.some(a=>a.id===id)?id:null;try{history.replaceState(null,"","#"+(cur||"inicio"));}catch(e){}render();if(scroll&&window.innerWidth<=820)$("art").scrollIntoView({behavior:"smooth",block:"start"});}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("ef-lang",lang)}catch(e){}render();});
$("q").addEventListener("input",e=>{q=e.target.value;renderList();});
$("brand").onclick=e=>{e.preventDefault();open(null);};
open((location.hash||"").slice(1)||null);
</script>
